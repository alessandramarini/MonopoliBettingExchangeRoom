<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Monopoly - Multi-language Tabletop Edition">
    <title>Monopoly Tabletop</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Colori Tabellone Classico Editrice Giochi */
            --bg-board: #acc4b1;
            --border-color: #1a1a1a;
            --cell-bg: #e8ecd3;
            
            /* Colori Proprietà */
            --brown: #8e5033; --lightblue: #8ed6ef; --pink: #db2b6c;
            --orange: #f5821c; --red: #e62c26; --yellow: #ffec19;
            --green: #41ab5d; --darkblue: #1b73b8;
            
            /* Colori Carte */
            --prob-color: #d1dac5;
            --impr-color: #f79854;
            
            /* Banconote */
            --c100: #65a5d1; --c1000: #7aba83; --c10000: #d8c4a9; --c50000: #e4808a;

            /* Texture realistiche */
            --paper-tex: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            --table-bg: radial-gradient(circle at center, #2e4133 0%, #111a14 100%);
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: var(--table-bg); color: #111; margin: 0; padding: 0;
            overflow: hidden; touch-action: none; user-select: none;
            -webkit-user-select: none; -webkit-font-smoothing: antialiased;
        }

        /* --- SCHERMATA INTRODUTTIVA (SCATOLA) RIVOLUZIONATA E FLUIDA --- */
        #intro-screen {
            position: fixed; inset: 0; z-index: 9999;
            background-color: #f4ede1; background-image: var(--paper-tex);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: opacity 0.5s ease; padding: 5vw;
        }
        
        .box-replica {
            position: relative; width: 100%; max-width: 850px; aspect-ratio: 2 / 1;
            background-color: #f4ede1; box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 0 60px rgba(0,0,0,0.05);
            border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;
            background-image: var(--paper-tex); transition: transform 0.3s ease;
        }
        .box-replica:hover { transform: scale(1.02) translateY(-5px); }

        .box-top-row { display: flex; align-items: center; justify-content: space-between; padding: 4% 8%; flex: 1; z-index: 2;}
        .box-bottom-row { display: flex; align-items: flex-end; justify-content: space-between; padding: 4% 8%; flex: 1; z-index: 2;}

        .box-red-stripe {
            position: absolute; top: 50%; left: 0; width: 100%; transform: translateY(-50%); height: 18%;
            background: linear-gradient(to bottom, #e0252b, #c21920); display: flex; align-items: center; justify-content: center;
            border-top: 3px solid #9e141a; border-bottom: 3px solid #9e141a; z-index: 10;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .box-title { font-family: 'Montserrat', sans-serif; font-size: clamp(28px, 7vw, 75px); font-weight: 900; color: #fff; letter-spacing: 0.08em; text-shadow: 3px 3px 0px rgba(0,0,0,0.8); }

        .box-green-sq { width: 28%; max-width: 180px; aspect-ratio: 1; background-color: #4da85d; box-shadow: 3px 3px 15px rgba(0,0,0,0.15); display: flex; align-items: center; justify-content: center; border-radius: 4px; }
        .mini-board-mockup { width: 85%; height: 85%; border: 2px solid #111; background: var(--bg-board); display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 1px; padding: 1px;}
        .mini-board-mockup div { background: var(--cell-bg); border: 1px solid #111; }

        .box-text-top { text-align: right; color: #111; font-family: 'Playfair Display', serif;}
        .box-text-top h2 { font-size: clamp(14px, 3.5vw, 30px); font-weight: 900; margin: 0; line-height: 1.1;}
        .box-text-top p { font-size: clamp(12px, 2.5vw, 22px); color: #2e7ca8; font-weight: bold; margin: 0; line-height: 1.1;}

        .box-blue-sq { width: 28%; max-width: 180px; height: 80%; background-color: #3b9bc2; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 2%; box-shadow: 3px 3px 15px rgba(0,0,0,0.15); border-radius: 4px 4px 0 0;}
        .box-logo-text { font-family: 'Playfair Display', serif; font-style: italic; color: #fff; font-size: clamp(12px, 2.8vw, 24px); font-weight: bold; text-align: center; line-height: 1;}
        
        .box-icon-group { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .box-trains { display: flex; align-items: center; gap: 12px; color: #3b9bc2; font-size: clamp(20px, 4.5vw, 45px); }
        .box-mr-mono { font-size: clamp(28px, 5.5vw, 55px); filter: drop-shadow(2px 2px 0 rgba(255,255,255,0.8)); }
        .box-dollar { color: #4da85d; font-size: clamp(35px, 7vw, 70px); font-weight: 900; font-family: 'Montserrat', sans-serif; line-height: 0.8; text-shadow: 1px 1px 0 #fff;}

        .click-to-start { position: absolute; bottom: 4vh; font-family: 'Montserrat', sans-serif; font-weight: 800; color: #111; font-size: clamp(14px, 4vw, 20px); letter-spacing: 2px; animation: pulse 1.5s infinite; background: rgba(255,255,255,0.7); padding: 10px 20px; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        @keyframes pulse { 0%, 100% { opacity: 0.6; transform: scale(0.98); } 50% { opacity: 1; transform: scale(1.02); } }

        /* Contenitore Principale Gioco */
        #app-container { display: flex; align-items: center; justify-content: center; width: 100dvw; height: 100dvh; position: relative; }

        /* --- TABELLONE DI GIOCO --- */
        #board-area {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            display: flex; align-items: center; justify-content: center;
            width: min(88dvw, 88dvh); height: min(88dvw, 88dvh);
            box-shadow: 0 25px 60px rgba(0,0,0,0.9), 0 0 0 clamp(4px, 1.2vmin, 10px) var(--border-color);
            background-color: var(--border-color); border-radius: 4px;
            z-index: 10; contain: layout style paint;
        }

        #board {
            width: 100%; height: 100%; display: grid;
            grid-template-columns: 15.5% repeat(9, 1fr) 15.5%;
            grid-template-rows: 15.5% repeat(9, 1fr) 15.5%;
            gap: clamp(1px, 0.25vmin, 3px);
            background-color: var(--border-color); 
        }

        .cell {
            background-color: var(--cell-bg); background-image: var(--paper-tex);
            position: relative; overflow: hidden; box-sizing: border-box; container-type: size;
        }

        .cell-content {
            position: absolute; top: 50%; left: 50%; display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start; text-align: center;
            box-sizing: border-box; padding: 2% 0;
        }

        .bottom-row .cell-content, .top-row .cell-content { width: 100cqw; height: 100cqh; }
        .left-col .cell-content, .right-col .cell-content { width: 100cqh; height: 100cqw; }
        .corner .cell-content { width: 100cqw; height: 100cqh; justify-content: center; padding: 0;}

        .bottom-row .cell-content { transform: translate(-50%, -50%) rotate(0deg); }
        .top-row .cell-content { transform: translate(-50%, -50%) rotate(180deg); }
        .left-col .cell-content { transform: translate(-50%, -50%) rotate(90deg); }
        .right-col .cell-content { transform: translate(-50%, -50%) rotate(-90deg); }
        #cell-0 .cell-content { transform: translate(-50%, -50%) rotate(-45deg); }
        #cell-10 .cell-content { transform: translate(-50%, -50%) rotate(45deg); }
        #cell-20 .cell-content { transform: translate(-50%, -50%) rotate(135deg); }
        #cell-30 .cell-content { transform: translate(-50%, -50%) rotate(-135deg); }

        .color-bar {
            position: absolute; top: 0; left: 0; right: 0; height: 22%;
            border-bottom: clamp(1px, 0.25vmin, 2px) solid var(--border-color); z-index: 2;
        }
        .has-color-bar { padding-top: 24%; }

        .property-name {
            font-weight: 700; font-size: clamp(4px, 1vmin, 12px); line-height: 1.1;
            text-transform: uppercase; margin: auto 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; letter-spacing: 0.02em;
            display: flex; align-items: center; justify-content: center; flex-grow: 1;
            padding: 0 4%; z-index: 1; color: #111; text-wrap: balance; word-wrap: break-word;
        }

        .property-price { font-size: clamp(3.5px, 0.8vmin, 10px); font-weight: 700; margin-bottom: 2%; flex-shrink: 0; color: #111; letter-spacing: 0.05em; }
        .icon-large { margin: auto; display: flex; align-items: center; justify-content: center; flex-grow: 1; }
        .svg-board-icon { width: clamp(18px, 4.5vmin, 55px); height: auto; max-height: clamp(18px, 4.5vmin, 55px); margin: auto; }
        
        #center-board {
            grid-column: 2 / span 9; grid-row: 2 / span 9;
            background-color: var(--bg-board); background-image: var(--paper-tex);
            position: relative; transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: center center; display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden; will-change: transform; box-shadow: inset 0 0 8vmin rgba(0,0,0,0.15);
        }

        .center-text-group { text-align: center; z-index: 5; margin-top: 2vmin; }
        .center-title { font-family: 'Montserrat', sans-serif; font-size: clamp(30px, 10vmin, 120px); font-weight: 300; letter-spacing: 0.12em; color: #1a1a1a; }
        .center-copyright { font-size: clamp(3px, 0.8vmin, 10px); font-family: 'Helvetica Neue', sans-serif; font-weight: 700; color: #222; margin-top: 0.5vmin; line-height: 1.4; text-transform: uppercase; }

        .deck-slot {
            position: absolute; width: 20vmin; height: 13vmin;
            border: clamp(1px, 0.2vmin, 2px) dashed rgba(0,0,0,0.4);
            display: flex; flex-direction: column; justify-content: center; align-items: center; perspective: 500px;
        }
        .deck-slot.probabilita { top: 14%; left: 14%; transform: rotate(-45deg); }
        .deck-slot.imprevisti { bottom: 14%; right: 14%; transform: rotate(-45deg); }
        
        .deck-stack {
            position: absolute; width: 95%; height: 90%; background-color: #fff; border-radius: 2px;
            box-shadow: -1px 1px 0 #ddd, -2px 2px 0 #bbb, -3px 3px 0 #ddd, -4px 4px 0 #bbb, -5px 5px 15px rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center; border: 1px solid rgba(0,0,0,0.1);
            transform: translateZ(10px); background-image: var(--paper-tex);
        }
        .deck-stack.bg-prob { background-color: var(--prob-color); }
        .deck-stack.bg-impr { background-color: var(--impr-color); }
        .deck-stack span { font-size: clamp(6px, 1.8vmin, 16px); font-weight: 800; font-family: 'Montserrat', sans-serif; color: rgba(0,0,0,0.7); text-transform: uppercase; letter-spacing: 0.1em; transform: rotate(180deg); }

        /* ZONE GIOCATORI */
        .player-zone {
            position: absolute; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: linear-gradient(135deg, rgba(0,0,0,0.5), rgba(0,0,0,0.8)); padding: 1vmin; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1); transition: all 0.3s ease; backdrop-filter: blur(8px);
        }
        .player-zone.active {
            background: linear-gradient(135deg, rgba(40,0,0,0.8), rgba(150,0,0,0.9)); border-color: #ed1b24;
            box-shadow: 0 0 25px rgba(237, 27, 36, 0.6), inset 0 0 15px rgba(0,0,0,0.8);
        }
        .pz-bottom { bottom: 1vmin; left: 50%; transform: translateX(-50%); width: 60vw; }
        .pz-left   { left: 1vmin; top: 50%; transform: translateY(-50%) rotate(90deg); width: 60vh; }
        .pz-top    { top: 1vmin; left: 50%; transform: translateX(-50%) rotate(180deg); width: 60vw; }
        .pz-right  { right: 1vmin; top: 50%; transform: translateY(-50%) rotate(-90deg); width: 60vh; }

        .pz-info { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; color: #fff; font-family: 'Montserrat', sans-serif; }
        .pz-name { font-weight: 800; font-size: clamp(12px, 2vmin, 20px); text-shadow: 1px 1px 2px #000; }
        .pz-token { width: clamp(20px, 3.5vmin, 35px); height: clamp(20px, 3.5vmin, 35px); filter: drop-shadow(1px 2px 2px #000); }
        .pz-balance { font-family: 'Oswald', sans-serif; font-size: clamp(14px, 2.2vmin, 24px); color: #00e676; text-shadow: 1px 1px 2px #000; }

        .note-wrapper {
            width: clamp(70px, 14vmin, 140px); aspect-ratio: 1.85 / 1;
            position: relative; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
            user-select: none; flex-shrink: 0; filter: drop-shadow(1px 2px 3px rgba(0,0,0,0.5));
        }
        .note-wrapper:hover { transform: translateY(-5px) scale(1.1) rotate(0deg) !important; z-index: 100 !important; filter: drop-shadow(3px 5px 8px rgba(0,0,0,0.7)); }
        .note-stack { display: flex; justify-content: center; width: 100%; height: clamp(35px, 7vmin, 70px); position: relative; }
        .note-stack .note-wrapper { position: absolute; }

        .payment-zone {
            background: rgba(0,0,0,0.04); border: 2px dashed #aaa; border-radius: 8px;
            min-height: 80px; display: flex; flex-wrap: wrap; gap: -20px; padding: 15px;
            justify-content: center; align-items: center; margin-bottom: 15px; width: 100%;
        }
        .payment-zone .note-wrapper { position: relative; transition: margin 0.2s, transform 0.2s; }
        .payment-zone .note-wrapper:hover { margin-right: 25px; transform: translateY(-10px) scale(1.15) !important; z-index: 50; }

        /* --- DADI PROPORZIONATI E REALISTICI --- */
        .dice-area { position: absolute; display: flex; gap: clamp(10px, 2.5vmin, 30px); z-index: 25; perspective: 1000px; }
        @keyframes dice-pulse { 0% { transform: scale(1); filter: drop-shadow(0 0 0 transparent); } 100% { transform: scale(1.1) translateY(-1vmin); filter: drop-shadow(0 1vmin 3vmin rgba(255,215,0,0.9)); } }
        .dice-ready { animation: dice-pulse 1s infinite alternate ease-in-out; cursor: pointer; }
        
        /* Dimensioni dadi regolate */
        .die-3d { width: clamp(26px, 6vmin, 55px); height: clamp(26px, 6vmin, 55px); position: relative; transform-style: preserve-3d; transition: transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .die-face { 
            position: absolute; width: 100%; height: 100%; 
            background: #111; border: clamp(1px, 0.3vmin, 2px) solid #333; border-radius: 18%; 
            display: grid; padding: 12%; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); 
            box-shadow: inset 0 0 1vmin rgba(255,255,255,0.15), inset 0 0 5px #000; 
        }
        .die-dot { 
            background: radial-gradient(circle at 30% 30%, #fff7b0 0%, #ffd700 40%, #b8860b 100%); 
            border-radius: 50%; width: 100%; height: 100%; box-shadow: inset 0.1vmin 0.1vmin 0.4vmin rgba(0,0,0,0.9), 0 0.1vmin 0.2vmin rgba(255,255,255,0.3); 
        }
        .dot-1 { grid-area: 1 / 1; } .dot-3 { grid-area: 1 / 3; } .dot-4 { grid-area: 2 / 1; } .dot-5 { grid-area: 2 / 2; } .dot-6 { grid-area: 2 / 3; } .dot-7 { grid-area: 3 / 1; } .dot-9 { grid-area: 3 / 3; }
        
        /* Traslazione facce basata sulla dimensione del dado per mantenere il cubo perfetto */
        .face-1 { transform: rotateY(0deg) translateZ(calc(clamp(26px, 6vmin, 55px) / 2)); } .face-2 { transform: rotateY(-90deg) translateZ(calc(clamp(26px, 6vmin, 55px) / 2)); }
        .face-3 { transform: rotateX(90deg) translateZ(calc(clamp(26px, 6vmin, 55px) / 2)); } .face-4 { transform: rotateX(-90deg) translateZ(calc(clamp(26px, 6vmin, 55px) / 2)); }
        .face-5 { transform: rotateY(90deg) translateZ(calc(clamp(26px, 6vmin, 55px) / 2)); } .face-6 { transform: rotateY(180deg) translateZ(calc(clamp(26px, 6vmin, 55px) / 2)); }
        
        .anim-jump { animation: jump 1.2s ease-out forwards; }
        @keyframes jump { 0% { transform: translateY(0) scale(1); } 40% { transform: translateY(-15vmin) scale(1.3) rotateX(360deg) rotateZ(180deg); } 70% { transform: translateY(-3vmin) scale(1.05); } 100% { transform: translateY(0) scale(1); } }

        .token { position: absolute; z-index: 30; width: clamp(24px, 5.5vmin, 50px); height: clamp(24px, 5.5vmin, 50px); transition: all 0.4s linear; transform: translate(-50%, -50%); pointer-events: none; }
        .token-svg { width: 100%; height: 100%; filter: drop-shadow(2px 5px 3px rgba(0,0,0,0.7)); }
        
        .house { width: clamp(5px, 1.2vmin, 14px); height: clamp(5px, 1.2vmin, 14px); background-color: #00a650; margin: 1px; box-shadow: inset -2px -2px 0px rgba(0,0,0,0.3), inset 2px 2px 0px rgba(255,255,255,0.4), 2px 2px 3px rgba(0,0,0,0.6); border-radius:1px;}
        .hotel { width: clamp(7px, 1.6vmin, 18px); height: clamp(7px, 1.6vmin, 18px); background-color: #ed1b24; margin: 1px; box-shadow: inset -3px -3px 0px rgba(0,0,0,0.3), inset 3px 3px 0px rgba(255,255,255,0.4), 2px 2px 3px rgba(0,0,0,0.6); border-radius:2px;}
        .buildings-container { display: flex; flex-wrap: wrap; justify-content: center; position: absolute; bottom: 2%; width: 100%; z-index: 3;}
        .has-color-bar .buildings-container { top: 2%; bottom: auto; }

        /* --- MODALI MIGLIORATE --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100dvw; height: 100dvh; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; z-index: 200; }
        .modal-box-wrapper { transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); will-change: transform; width: 100%; display: flex; justify-content: center; }
        
        .modal-box { 
            background: #fdfbf7; background-image: var(--paper-tex); 
            border-radius: 12px; width: 92vw; max-width: 480px; max-height: 95dvh; 
            padding: clamp(20px, 5vw, 30px); 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.5) inset; 
            color: #111; position: relative; text-align: center; overflow-y: auto; overflow-x: hidden; box-sizing: border-box; 
        }
        
        .modal-box.solid-card { border-radius: 8px; border: 1px solid rgba(0,0,0,0.2); padding: 0; display: flex; flex-direction: column; }

        .lang-selector { display: flex; gap: 8px; z-index: 10; margin-bottom: 20px; justify-content: center; }
        .lang-btn { background: #333; color: #fff; border: none; padding: 6px 14px; font-size: 13px; cursor: pointer; border-radius: 20px; font-weight: bold; transition: all 0.2s;}
        .lang-btn:hover { background: #555; transform: scale(1.05);}
        .lang-btn.active { background: #ed1b24; box-shadow: 0 3px 10px rgba(237,27,36,0.4); }

        .btn { 
            padding: clamp(12px, 2.5vw, 15px) clamp(15px, 3.5vw, 20px); 
            border: none; border-radius: 8px; font-weight: 800; cursor: pointer; transition: all 0.15s; 
            background: linear-gradient(to bottom, #f0f0f0, #e0e0e0); color: #222;
            text-transform: uppercase; width: 100%; margin-top: 10px; font-family: 'Montserrat', sans-serif; 
            box-shadow: 0 4px 0 #bbb, 0 8px 15px rgba(0,0,0,0.1); box-sizing: border-box; 
            display: inline-flex; justify-content: center; align-items: center; text-align: center; line-height: 1.2; font-size: clamp(12px, 2.5vw, 15px); 
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 0 0 #bbb, 0 2px 5px rgba(0,0,0,0.1); }
        .btn-buy { background: linear-gradient(to bottom, #00c660, #00a650); color: white; box-shadow: 0 4px 0 #007336, 0 8px 15px rgba(0,166,80,0.3); }
        .btn-buy:active { box-shadow: 0 0 0 #007336; }
        .btn-pay { background: linear-gradient(to bottom, #ff3b44, #ed1b24); color: white; box-shadow: 0 4px 0 #b00f17, 0 8px 15px rgba(237,27,36,0.3); }
        .btn-pay:active { box-shadow: 0 0 0 #b00f17; }
        .btn-inline { width: auto; flex: 1 1 auto; min-width: 120px; }

        .card-property-original { background: #fff; background-image: var(--paper-tex); border: 1px solid #ddd; border-radius: 6px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); padding: clamp(10px, 3vw, 15px); margin-bottom: 20px; box-sizing: border-box; width: 100%; }
        .cpo-header { border: 2px solid #111; padding: 10px 5px; margin-bottom: 15px; border-radius: 4px; }
        .cpo-subtitle { font-size: clamp(9px, 2vw, 0.7rem); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .cpo-title { font-size: clamp(18px, 4.5vw, 1.6rem); font-family: 'Montserrat', sans-serif; font-weight: 900; text-transform: uppercase; line-height:1.1;}
        .cpo-body { font-size: clamp(12px, 3vw, 0.95rem); font-family: 'Helvetica Neue', sans-serif; line-height: 1.6; padding: 0 5px; text-align: left; }
        .cpo-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .cpo-row span:last-child { font-weight: bold; }
        .cpo-divider { border-top: 1px solid #ddd; margin: 10px 0; }

        function getNotesArray(amount) {
            let notes = []; let rem = amount;
            let c50=0, c10=0, c1=0, c01=0;
            if (rem >= 500) { c01 = 5; rem -= 500; }
            if (rem >= 5000) { c1 = 5; rem -= 5000; }
            if (rem >= 40000) { c10 = 4; rem -= 40000; }
            c50 += Math.floor(rem / 50000); rem %= 50000;
            c10 += Math.floor(rem / 10000); rem %= 10000;
            c1 += Math.floor(rem / 1000); rem %= 1000;
            c01 += Math.floor(rem / 100); rem %= 100;
            const addN = (val, count) => { for(let i=0; i<count; i++) notes.push(val); };
            addN(50000, c50); addN(10000, c10); addN(1000, c1); addN(100, c01);
            return notes;
        }

        function detectBrowserLanguage() {

            return ['en', 'es', 'pt', 'it'].includes(lang) ? lang : 'en';
        }

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('onclick').includes(`'${lang}'`));
            });
            document.querySelectorAll('[data-i18n]').forEach(el => { 
                if(el.tagName === 'INPUT') el.value = t(el.getAttribute('data-i18n'));
                else el.innerHTML = t(el.getAttribute('data-i18n'));

        function initBoard() {
            const board = document.getElementById('board'); const fragment = document.createDocumentFragment(); 
            getBoardData().forEach(data => {
                const cell = document.createElement('div'); cell.className = `cell ${data.type === 'corner' ? 'corner' : ''}`; cell.id = `cell-${data.id}`;
                const pos = cellPos[data.id]; cell.style.gridColumn = pos.c; cell.style.gridRow = pos.r;
                cell.classList.add(data.id > 0 && data.id < 10 ? "bottom-row" : data.id > 10 && data.id < 20 ? "left-col" : data.id > 20 && data.id < 30 ? "top-row" : data.id > 30 && data.id < 40 ? "right-col" : "none");

                let html = `<div class="cell-content ${data.color ? 'has-color-bar' : ''}">`;
                if (data.type === 'property') {
                    html += `<div class="color-bar" id="cb-${data.id}" style="background-color: ${data.color};"></div>
                             <div class="property-name">${data.name}</div>
                             <div class="property-price">L. ${data.price}</div>
                             <div class="buildings-container" id="bld-${data.id}"></div>`;
                } else if (data.type === 'corner') {
                    html += `${data.svg ? data.svg : `<div class="icon-large">${data.icon}</div>`}`;
                } else if (data.type === 'tax') {
                    html += `<div class="property-name" style="padding-top:15%">${data.name}</div>${data.svg ? data.svg : ``}`;

                    html += `<div class="property-name" style="padding-top:2%">${data.name}</div>${data.svg ? data.svg : `<div class="icon-large">${data.icon}</div>`}`;

                }

                if(!gameState.properties[data.id] && (data.type === 'property' || data.type === 'station' || data.type === 'utility')) {

        function startGame() {
            if(setupPlayerCount < 2) return showToast("Aggiungi almeno 2 giocatori");
            for(let i=1; i<=setupPlayerCount; i++) {
                gameState.players.push({ id: i, name: document.getElementById(`pname-${i}`).value, emoji: document.getElementById(`ptoken-${i}`).value, balance: 150000, pos: 0, inJail: false, jailTurns: 0 });
            }
            document.getElementById('modal-setup').style.display = 'none';
            gameState.players.forEach(p => {
                const tkn = document.createElement('div'); tkn.id = `token-${p.id}`; tkn.className = 'token'; tkn.innerHTML = tokenSVGs[p.emoji];
                document.getElementById('board-area').appendChild(tkn);
            });
            updateTokens(); updateDashboard(); orientBoard(); document.getElementById('dice-area').classList.add('dice-ready');
        }

        function updateDashboard() {
            gameState.players.forEach((p, i) => {
                const zone = document.getElementById(`pz-${i}`); if(!zone) return;
                zone.style.display = 'flex';
                
                let notesHtml = '<div class="note-stack">';
                const notes = getNotesArray(p.balance);
                notes.slice(0, 8).forEach((val, idx) => {
                    notesHtml += generateNoteSVG(val, noteColors[val]).replace('<div class="note-wrapper', `<div class="note-wrapper" style="left: ${idx * 15}px; z-index: ${idx};"`);
                });
                if(notes.length > 8) notesHtml += `<div style="position:absolute; right:-20px; top:20px; color:white; font-weight:bold;">+${notes.length-8}</div>`;
                notesHtml += '</div>';

                zone.innerHTML = `
                    <div class="pz-info">
                        <div class="pz-token">${tokenSVGs[p.emoji]}</div>
                        <div class="pz-name">${p.name}</div>
                        <div class="pz-balance">L. ${p.balance.toLocaleString('it-IT')}</div>
                    </div>
                    ${notesHtml}
                `;
            });
        }

        function updateTokens() {
            if (gameState.players.length === 0) return;
            const parentRect = document.getElementById('board-area').getBoundingClientRect();
            gameState.players.forEach(p => {
                const cell = document.getElementById(`cell-${p.pos}`); if(!cell) return;
                const rect = cell.getBoundingClientRect();
                const offsetX = (p.id % 2 === 0 ? -6 : 6); const offsetY = (p.id > 2 ? -6 : 6);
                const tEl = document.getElementById(`token-${p.id}`);
                tEl.style.left = `${(rect.left - parentRect.left) + rect.width/2 + offsetX}px`;
                tEl.style.top = `${(rect.top - parentRect.top) + rect.height/2 + offsetY}px`;
            });
        }
        window.addEventListener('resize', () => setTimeout(updateTokens, 100));

        function orientBoard() {
            const rot = [0, 90, 180, -90][gameState.currentPlayerIdx] || 0;
            const cb = document.getElementById('center-board'); if (cb) cb.style.transform = `rotate(${rot}deg)`;
            const aw = document.getElementById('action-wrapper'); if (aw) aw.style.transform = `scale(1) rotate(${rot}deg)`;
            document.querySelectorAll('.player-zone').forEach((z, i) => z.classList.toggle('active', i === gameState.currentPlayerIdx));
        }

        const diceRots = { 1: {x: 0, y: 0}, 2: {x: 0, y: 90}, 3: {x: -90, y: 0}, 4: {x: 90, y: 0}, 5: {x: 0, y: -90}, 6: {x: 180, y: 0} };
        function rollDice() {
            const diceArea = document.getElementById('dice-area');
            if(!diceArea.classList.contains('dice-ready') || gameState.isMoving) return;
            diceArea.classList.remove('dice-ready'); 
            
            const p = gameState.players[gameState.currentPlayerIdx];
            if(p.inJail) {
                p.jailTurns++;
                if(p.jailTurns > 3) { p.inJail = false; p.jailTurns = 0; payBankActive(5000); return; } 
                else { setTimeout(endTurn, 1000); return; }
            }

            gameState.isMoving = true;
            const val1 = Math.floor(Math.random() * 6) + 1; const val2 = Math.floor(Math.random() * 6) + 1;
            gameState.lastRoll = val1 + val2;

            const d1El = document.getElementById('die1'); const d2El = document.getElementById('die2');
            const b1 = document.getElementById('bounce1'); const b2 = document.getElementById('bounce2');
            b1.classList.remove('anim-jump'); b2.classList.remove('anim-jump'); void b1.offsetWidth;
            b1.classList.add('anim-jump'); b2.classList.add('anim-jump');

            const spin = () => Math.floor(Math.random() * 2 + 2) * 360;
            d1El.style.transform = `rotateX(${diceRots[val1].x + spin()}deg) rotateY(${diceRots[val1].y + spin()}deg)`;
            d2El.style.transform = `rotateX(${diceRots[val2].x + spin()}deg) rotateY(${diceRots[val2].y + spin()}deg)`;

            setTimeout(() => stepMove(p, gameState.lastRoll), 1200);
        }

        function stepMove(player, stepsLeft) {
            if(stepsLeft === 0) { setTimeout(() => handleLanded(player), 300); return; }
            player.pos++; if(player.pos >= 40) { player.pos = 0; receiveMoney(player, 20000); showToast(t('go_msg')); }
            updateTokens(); setTimeout(() => stepMove(player, stepsLeft - 1), 300); 
        }

        function handleLanded(player) {
            const bd = getBoardData(); const cell = bd[player.pos]; let html = ''; let isCard = false; let cardColor = '';
            
            if (cell.type === 'property' || cell.type === 'station' || cell.type === 'utility') {
                const propState = gameState.properties[cell.id];
                const headerColor = cell.color || '#333'; const fontCol = '#fff';
                
                html += `
                    <div class="card-property-original">
                        <div class="cpo-header" style="background-color: ${headerColor}; color: ${fontCol};">
                            <div class="cpo-subtitle">${cell.type === 'property' ? t('prop_title') : ''}</div>
                            <div class="cpo-title">${cell.name.replace(/<br>/g, ' ')}</div>
                        </div>
                        <div class="cpo-body">`;
                
                if(cell.type === 'property') {
                    html += `
                        <div class="cpo-row mb-2"><span>${t('rent_base')}</span> <span>L. ${cell.rent[0]}</span></div>
                        ${[1,2,3,4].map(i => `<div class="cpo-row"><span>${t('with_house')} ${i} ${t('houses')}</span> <span>L. ${cell.rent[i]}</span></div>`).join('')}
                        <div class="cpo-row mt-2" style="font-size: 0.95rem;"><span>${t('with_house')} ${t('hotel')}</span> <span>L. ${cell.rent[5]}</span></div>
                        <div class="cpo-divider"></div>
                        <div class="cpo-footer">${t('mortgage')} L. ${cell.price / 2}<br>${t('house_cost')} L. ${cell.houseCost}</div>`;
                } else {
                    html += `<div class="text-center font-bold text-lg mb-2">${t('val_msg')} L. ${cell.price}</div><div class="text-center italic text-xs">${t('var_rent')}</div>`;
                }
                html += `</div></div>`;

                if (!propState.ownerId) {
                    html += `<div class="flex gap-2">
                                <button class="btn btn-buy btn-inline" onclick="buyProperty(${cell.id})">${t('buy_btn')} L. ${cell.price}</button>
                                <button class="btn btn-inline" onclick="endTurn()">${t('pass_btn')}</button>
                             </div>`;
                } else if (propState.ownerId !== player.id) {
                    const owner = gameState.players.find(p => p.id === propState.ownerId); const rent = calculateRent(cell, propState);
                    html += `<p class="mb-3 text-red-600 font-bold text-lg">${t('prop_of')} ${owner.name}</p>
                             <button class="btn btn-pay" onclick="payRent(${cell.id}, ${rent})">${t('pay_btn')} L. ${rent}</button>`;
                } else if (cell.type === 'property' && propState.level < 5) {
                    html += `<p class="mb-3 text-green-600 font-bold">${t('your_prop')}</p>
                             <div class="flex gap-2">
                                <button class="btn btn-buy btn-inline" onclick="buildHouse(${cell.id})">${t('build_btn')} L. ${cell.houseCost}</button>
                                <button class="btn btn-inline" onclick="endTurn()">${t('end_turn')}</button>
                             </div>`;
                } else { html += `<button class="btn" onclick="endTurn()">${t('end_turn')}</button>`; }
            } else if (cell.type === 'chance' || cell.type === 'chest') {
                isCard = true;
                const isProb = cell.type === 'chance'; 
                cardColor = isProb ? 'var(--prob-color)' : 'var(--impr-color)';
                const events = i18n[currentLang].events;
                const eventTxt = events[Math.floor(Math.random() * events.length)];
                
                html += `
                    <div class="flex flex-col items-center justify-center h-full text-[#111] px-6 py-10" style="min-height: 250px;">
                        <div class="font-black text-2xl md:text-3xl mb-8 font-['Montserrat'] uppercase tracking-widest text-center opacity-80 border-b-2 border-[#111] pb-3 w-full">${isProb ? t('chance_title') : t('chest_title')}</div>
                        <div class="text-lg md:text-xl font-medium font-['Helvetica_Neue',sans-serif] text-center leading-relaxed w-full">"${eventTxt}"</div>
                    </div>
                    <div class="flex justify-center p-4 w-full bg-black bg-opacity-5">
                        <button class="btn bg-white bg-opacity-40 border-[#111] text-[#111] shadow-none hover:bg-opacity-60 w-full max-w-[200px]" onclick="resolveCard('${eventTxt}')">${t('ok_btn')}</button>
                    </div>`;
            } else if (cell.type === 'tax') {
                html += `<h2 class="text-xl font-bold mb-3 text-red-600 font-['Montserrat']">${cell.name.replace(/<br>/g, ' ')}</h2>
                         <button class="btn btn-pay" onclick="payBankActive(${cell.cost})">${t('pay_btn')} L. ${cell.cost}</button>`;
            } else if (cell.id === 30) {
                html += `<h2 class="text-xl font-bold mb-3 text-red-600 font-['Montserrat']">${t('go_jail_btn')}</h2>
                         <button class="btn btn-pay" onclick="goToJail()">${t('ok_btn')}</button>`;
            } else {
                html += `<h2 class="text-xl font-bold mb-3 font-['Montserrat']">${cell.name.replace(/<br>/g, ' ')}</h2><button class="btn" onclick="endTurn()">${t('ok_btn')}</button>`;
            }
            openModal(html, isCard, cardColor);
        }

        function calculateRent(cell, propState) {
            if (cell.type === 'property') return cell.rent[propState.level];
            if (cell.type === 'station') return 2500 * Math.pow(2, [5,15,25,35].filter(id => gameState.properties[id].ownerId === propState.ownerId).length - 1);
            if (cell.type === 'utility') return gameState.lastRoll * ([12,28].filter(id => gameState.properties[id].ownerId === propState.ownerId).length === 2 ? 1000 : 400);
            return 0;
        }

        function buyProperty(cellId) {
            const p = gameState.players[gameState.currentPlayerIdx]; const cell = getBoardData().find(c => c.id === cellId);
            openPayment(cell.price, t('buy_title'), () => {
                p.balance -= cell.price; gameState.properties[cellId].ownerId = p.id;
                document.getElementById(`cell-${cellId}`).style.border = `2px solid ${['#ed1b24','#00a650','#0054a6','#f57c00'][p.id%4]}`;
                updateDashboard(); endTurn();
            });
        }
        function payRent(cellId, amount) {
            const p = gameState.players[gameState.currentPlayerIdx]; const ownerId = gameState.properties[cellId].ownerId;
            openPayment(amount, t('rent_title'), () => {
                p.balance -= amount; gameState.players.find(x => x.id === ownerId).balance += amount; updateDashboard(); endTurn();
            });
        }
        function buildHouse(cellId) {
            const p = gameState.players[gameState.currentPlayerIdx]; const cell = getBoardData().find(c => c.id === cellId);
            openPayment(cell.houseCost, t('build_title'), () => {
                p.balance -= cell.houseCost; gameState.properties[cellId].level++; renderBuildings(cellId); updateDashboard(); endTurn();
            });
        }
        function renderBuildings(cellId) {
            const bld = document.getElementById(`bld-${cellId}`); if(!bld) return;
            const lvl = gameState.properties[cellId]?.level || 0; bld.innerHTML = '';
            if(lvl === 5) bld.innerHTML = `<div class="hotel"></div>`;
            else for(let i=0; i<lvl; i++) bld.innerHTML += `<div class="house"></div>`;
        }
        
        function resolveCard(txt) {
            closeModal(); const p = gameState.players[gameState.currentPlayerIdx];
            if(txt.includes('10.000')) { receiveMoney(p, 10.000); endTurn(); }
            else if(txt.includes('15.000')) { receiveMoney(p, 15000); endTurn(); }
            else if(txt.includes('1.500')) payBankActive(1500);
            else if(txt.includes('prigione') || txt.includes('jail') || txt.includes('cárcel') || txt.includes('prisão')) goToJail();
            else { p.pos = 0; updateTokens(); endTurn(); }
        }
        function payBankActive(amount) { openPayment(amount, t('tax_title'), () => { gameState.players[gameState.currentPlayerIdx].balance -= amount; updateDashboard(); endTurn(); }); }
        function receiveMoney(player, amount) { player.balance += amount; updateDashboard(); }
        function goToJail() { closeModal(); const p = gameState.players[gameState.currentPlayerIdx]; p.pos = 10; p.inJail = true; updateTokens(); endTurn(); }

        let currentPayment = { amount: 0, callback: null, traySum: 0, wallet: [], tray: [] };

        function openPayment(amount, reason, callback) {
            const p = gameState.players[gameState.currentPlayerIdx];
            if (p.balance < amount) { showToast(`⚠️ ${t('bankrupt_msg')} ${p.name}!`); p.balance = -1; endTurn(); return; }

            closeModal();
            const pw = document.getElementById('payment-wrapper');
            if(pw) pw.style.transform = `scale(1) rotate(${[0, 90, 180, -90][gameState.currentPlayerIdx] || 0}deg)`;

            currentPayment = { amount: amount, callback: callback, traySum: 0, wallet: getNotesArray(p.balance), tray: [] };
            document.getElementById('pay-title').innerText = reason; renderPaymentUI();
            document.getElementById('modal-payment').style.display = 'flex';
        }

        function renderPaymentUI() {
            document.getElementById('pay-desc').innerHTML = `${t('pay_req')} <b>L. ${currentPayment.amount.toLocaleString('it-IT')}</b>`;
            
            const renderNotes = (arr, onclickStr) => {
                if(arr.length === 0) return `<span class="text-gray-400 text-sm w-full text-center">${t('empty')}</span>`;
                return arr.map((val, i) => {
                    const svgHtml = generateNoteSVG(val, noteColors[val]);
                    return svgHtml.replace('<div ', `<div onclick="${onclickStr}(${i})" `);
                }).join('');
            };

            document.getElementById('pay-tray').innerHTML = renderNotes(currentPayment.tray, 'moveNoteToWallet');
            document.getElementById('pay-wallet').innerHTML = renderNotes(currentPayment.wallet, 'moveNoteToTray');

            const sumEl = document.getElementById('tray-sum'); sumEl.innerText = `L. ${currentPayment.traySum.toLocaleString('it-IT')}`;
            const btnConfirm = document.getElementById('btn-confirm-pay');
            
            if (currentPayment.traySum >= currentPayment.amount) {
                sumEl.className = "float-right text-green-600 font-bold text-lg"; btnConfirm.disabled = false;
                const change = currentPayment.traySum - currentPayment.amount;
                btnConfirm.innerText = change > 0 ? `${t('pay_recv')} (L. ${change.toLocaleString()})` : t('confirm_pay');
            } else {
                sumEl.className = "float-right text-red-600 font-bold text-lg"; btnConfirm.disabled = true; btnConfirm.innerText = t('confirm_pay');
            }
        }

        function moveNoteToTray(index) { const val = currentPayment.wallet.splice(index, 1)[0]; currentPayment.tray.push(val); currentPayment.traySum += val; renderPaymentUI(); }
        function moveNoteToWallet(index) { const val = currentPayment.tray.splice(index, 1)[0]; currentPayment.wallet.push(val); currentPayment.traySum -= val; renderPaymentUI(); }
        function confirmPayment() { if (currentPayment.traySum >= currentPayment.amount) { document.getElementById('modal-payment').style.display = 'none'; currentPayment.callback(); } }
        function cancelPayment() { document.getElementById('modal-payment').style.display = 'none'; endTurn(); }

        function openModal(html, isCard = false, bgColor = '') { 
            const content = document.getElementById('action-content');
            content.innerHTML = html;
            
            if (isCard) {
                content.className = 'modal-box solid-card';
                content.style.backgroundColor = bgColor;
            } else {
                content.className = 'modal-box';
                content.style.backgroundColor = '#fdfbf7';
            }
            
            document.getElementById('modal-action').style.display = 'flex'; 
        }
        function closeModal() { document.getElementById('modal-action').style.display = 'none'; }

        function endTurn() {
            closeModal(); gameState.isMoving = false;
            if(gameState.players[gameState.currentPlayerIdx].balance < 0) showToast(`⚠️ ${t('bankrupt_msg')} ${gameState.players[gameState.currentPlayerIdx].name}!`);
            gameState.currentPlayerIdx = (gameState.currentPlayerIdx + 1) % gameState.players.length;
            orientBoard(); updateDashboard(); setTimeout(() => document.getElementById('dice-area').classList.add('dice-ready'), 500);
        }

        window.onload = () => { 
            const detectedLang = detectBrowserLanguage();
            setLang(detectedLang); 
            initBoard(); 
            addSetupPlayer(); addSetupPlayer(); 
        };
    </script>
</body>
</html>
