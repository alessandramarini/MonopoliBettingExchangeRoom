<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Monopoli - Edizione Classica Tabletop Multi-language">
    <title>Monopoli - Edizione Classica Tabletop</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Colori Originali Editrice Giochi Tabellone */
            --bg-board: #b8d4c0; --border-color: #111;
            --brown: #8e4a23; --lightblue: #9bd2f0; --pink: #d93c96;
            --orange: #f7941d; --red: #ed1b24; --yellow: #fff200;
            --green: #00a650; --darkblue: #0054a6;
            --prob-color: #e6ebc8; --impr-color: #f79759;
            
            /* Colori Esatti Banconote campionati dalla foto */
            --n100-c: #5ea3cc; 
            --n1000-c: #74bc7e;
            --n10000-c: #d4c0a5; 
            --n50000-c: #e8868f;

            /* Texture Carta (Data URI leggerissimo) */
            --paper-tex: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
            --table-tex: radial-gradient(circle at center, #2e4732 0%, #0a120c 100%);
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: var(--table-tex); color: #111; margin: 0; padding: 0;
            overflow: hidden; touch-action: none; user-select: none;
            -webkit-user-select: none; -webkit-font-smoothing: antialiased;
        }

        #app-container {
            display: flex; align-items: center; justify-content: center;
            width: 100vw; height: 100vh; position: relative;
        }

        /* TABELLONE CENTRALE */
        #board-area {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            display: flex; align-items: center; justify-content: center;
            width: min(75vw, 75vh); height: min(75vw, 75vh);
            box-shadow: 0 10px 40px rgba(0,0,0,0.9), 0 0 0 clamp(2px, 0.8vmin, 6px) #eaddcd;
            background-color: var(--border-color); border-radius: 4px;
            z-index: 10; contain: layout style paint;
        }

        #board {
            width: 100%; height: 100%; display: grid;
            grid-template-columns: 14% repeat(9, 1fr) 14%;
            grid-template-rows: 14% repeat(9, 1fr) 14%;
            gap: clamp(1px, 0.2vmin, 2px);
            background-color: var(--border-color); padding: clamp(1px, 0.2vmin, 2px);
        }

        .cell {
            background-color: var(--bg-board); background-image: var(--paper-tex);
            position: relative; display: flex; overflow: hidden; box-sizing: border-box;
        }

        .cell-content {
            width: 100%; height: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: space-between; text-align: center;
            transform-origin: center center; padding: 0; box-sizing: border-box;
        }

        .bottom-row .cell-content { transform: rotate(0deg); }
        .left-col .cell-content { transform: rotate(90deg); }
        .top-row .cell-content { transform: rotate(180deg); }
        .right-col .cell-content { transform: rotate(-90deg); }

        .cell.corner { justify-content: center; align-items: center; }
        .cell.corner .cell-content { justify-content: center; padding: 5%; }
        #cell-0 .cell-content { transform: rotate(-45deg); }
        #cell-10 .cell-content { transform: rotate(45deg); }
        #cell-20 .cell-content { transform: rotate(135deg); }
        #cell-30 .cell-content { transform: rotate(-135deg); }

        .color-bar {
            width: 100%; height: 21%; min-height: 4px;
            border-bottom: clamp(1px, 0.2vmin, 3px) solid #111; 
            flex-shrink: 0; box-shadow: inset 0 -2px 4px rgba(0,0,0,0.15);
        }

        .property-name {
            font-weight: 800; font-size: clamp(5px, 0.95vmin, 12px); line-height: 1.05;
            text-transform: uppercase; padding: 2px 2%; margin: auto 0;
            font-family: 'Montserrat', sans-serif; letter-spacing: -0.02em;
            word-wrap: break-word; overflow-wrap: break-word; text-align: center;
            display: flex; align-items: center; justify-content: center; flex-grow: 1;
            max-height: 50%; overflow: hidden;
        }

        .property-price { font-size: clamp(4px, 0.8vmin, 10px); font-weight: bold; margin-bottom: 2%; flex-shrink: 0; letter-spacing: -0.02em; }
        .icon-large { font-size: clamp(10px, 2.5vmin, 30px); margin: auto; flex-shrink: 0; }
        .svg-board-icon { width: clamp(12px, 3.2vmin, 35px); height: clamp(12px, 3.2vmin, 35px); margin: auto; display: block; filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.3)); flex-shrink: 0; }
        
        #center-board {
            grid-column: 2 / span 9; grid-row: 2 / span 9;
            background-color: var(--bg-board); background-image: var(--paper-tex);
            position: relative; transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: center center; display: flex; align-items: center; justify-content: center;
            overflow: hidden; will-change: transform; box-shadow: inset 0 0 5vmin rgba(0,0,0,0.1);
        }

        .logo-container {
            position: absolute; background: #e31821; color: white;
            padding: clamp(6px, 1.5vmin, 15px) clamp(15px, 4vmin, 40px); 
            /* Doppio bordo stile scatola originale */
            border: clamp(2px, 0.4vmin, 5px) solid #111;
            font-size: clamp(16px, 4.5vmin, 55px); font-family: 'Montserrat', sans-serif;
            font-weight: 900; letter-spacing: 0.15em;
            box-shadow: inset 0 0 0 clamp(2px, 0.5vmin, 6px) #fff, 0 0 0 clamp(1px, 0.3vmin, 4px) #111, clamp(3px, 1vmin, 10px) clamp(3px, 1vmin, 10px) clamp(5px, 2vmin, 15px) rgba(0,0,0,0.5);
            transform: rotate(-45deg); z-index: 5; text-shadow: 2px 2px 0 #900;
        }

        .deck {
            position: absolute; width: 17vmin; height: 10vmin;
            min-width: 50px; min-height: 30px; border-radius: 4px;
            border: clamp(1px, 0.2vmin, 2px) solid rgba(0,0,0,0.8); display: flex; flex-direction: column;
            justify-content: center; align-items: center; background-image: var(--paper-tex);
            box-shadow: -1px 1px 0 #fff, -2px 2px 0 #ccc, -3px 3px 0 #fff, -4px 4px 0 #999, -6px 6px 15px rgba(0,0,0,0.5);
        }
        .deck-imprevisti { top: 12%; left: 12%; transform: rotate(135deg); background-color: var(--impr-color); }
        .deck-probabilita { bottom: 12%; right: 12%; transform: rotate(-45deg); background-color: var(--prob-color); }
        .deck-title { font-size: clamp(6px, 1.5vmin, 14px); font-weight: 900; letter-spacing: 0.05em; font-family: 'Montserrat', sans-serif; color:#111; text-transform: uppercase;}
        .deck-q { font-size: clamp(14px, 3.5vmin, 35px); font-family: 'Playfair Display', serif; font-weight: bold; opacity: 0.6; color:#111; line-height: 1; }

        /* AREE GIOCATORI SUI BORDI DELLO SCHERMO */
        .player-zone {
            position: absolute; z-index: 5;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.3); padding: 1vmin; border-radius: 12px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
        }
        .player-zone.active {
            background: rgba(237, 27, 36, 0.25); border: 2px solid #ed1b24;
            box-shadow: 0 0 20px rgba(237, 27, 36, 0.4), inset 0 0 15px rgba(0,0,0,0.6);
        }
        
        .pz-bottom { bottom: 1vmin; left: 50%; transform: translateX(-50%); width: 60vw; }
        .pz-left   { left: 1vmin; top: 50%; transform: translateY(-50%) rotate(90deg); width: 60vh; }
        .pz-top    { top: 1vmin; left: 50%; transform: translateX(-50%) rotate(180deg); width: 60vw; }
        .pz-right  { right: 1vmin; top: 50%; transform: translateY(-50%) rotate(-90deg); width: 60vh; }

        .pz-info { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; color: #fff; font-family: 'Montserrat', sans-serif; }
        .pz-name { font-weight: 800; font-size: clamp(12px, 2vmin, 20px); text-shadow: 1px 1px 2px #000; }
        .pz-token { width: clamp(20px, 3.5vmin, 35px); height: clamp(20px, 3.5vmin, 35px); filter: drop-shadow(1px 2px 2px #000); }
        .pz-balance { font-family: 'Oswald', sans-serif; font-size: clamp(14px, 2.2vmin, 24px); color: #00e676; text-shadow: 1px 1px 2px #000; }

        /* =========================================
           SIMULATORE STAMPA BANCONOTE FOTOCOPIA 
           ========================================= */
        .real-note {
            width: clamp(70px, 13vmin, 120px); 
            aspect-ratio: 1.85 / 1;
            background-color: #fdfbf7; /* Colore carta margine bianco */
            border-radius: 2px; position: relative; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 1px 2px 4px rgba(0,0,0,0.5); user-select: none; flex-shrink: 0; box-sizing: border-box;
            background-image: var(--paper-tex); 
            padding: 2.5%; /* Margine bianco esterno */
            container-type: inline-size;
        }
        
        .note-margin {
            width: 100%; height: 100%; position: relative;
            border: 1px solid currentColor; padding: 2%; box-sizing: border-box;
        }

        .note-frame {
            width: 100%; height: 100%; position: relative;
            background-color: currentColor; border: 1px solid currentColor;
            display: flex; align-items: center; justify-content: center; border-radius: 1px;
            /* Pattern Guilloché incrociato fedele all'originale */
            background-image: 
                repeating-linear-gradient(45deg, transparent, transparent 1px, rgba(255,255,255,0.45) 1px, rgba(255,255,255,0.45) 2.5px),
                repeating-linear-gradient(-45deg, transparent, transparent 1px, rgba(255,255,255,0.45) 1px, rgba(255,255,255,0.45) 2.5px);
            box-sizing: border-box;
        }
        
        /* I 4 quadratini agli angoli */
        .note-corner {
            position: absolute; font-family: 'Helvetica Neue', Helvetica, sans-serif; font-weight: 700;
            font-size: 11cqi; color: currentColor; background: #fdfbf7; 
            padding: 1% 4%; border: 1px solid currentColor; line-height: 1.1; z-index: 2;
        }
        .note-corner.tl { top: -1px; left: -1px; } .note-corner.tr { top: -1px; right: -1px; }
        .note-corner.bl { bottom: -1px; left: -1px; } .note-corner.br { bottom: -1px; right: -1px; }
        
        /* Ovale Bianco Centrale */
        .note-center {
            background: #fdfbf7; border-radius: 50%;
            width: 62%; height: 88%; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            box-shadow: inset 0 0 0 2px #fdfbf7, inset 0 0 0 3.5px currentColor, inset 0 0 5px rgba(0,0,0,0.2); z-index: 1;
            padding: 1.5% 0; box-sizing: border-box; position: relative;
        }
        
        .note-arch { width: 90%; height: 35%; overflow: visible; margin-top: 3%; flex-shrink: 0; }
        .note-val { font-family: 'Helvetica Neue', Helvetica, sans-serif; font-size: 25cqi; font-weight: 900; color: currentColor; line-height: 0.8; letter-spacing: -0.5px; }
        .note-train { font-size: 12cqi; line-height: 1; opacity: 0.7; color: #111; margin-bottom: 2%; flex-shrink: 0;}
        
        .real-note:hover { transform: translateY(-5px) scale(1.1); box-shadow: 3px 5px 12px rgba(0,0,0,0.6); z-index: 10; }
        
        .note-100 { color: var(--n100-c); }
        .note-1000 { color: var(--n1000-c); }
        .note-10000 { color: var(--n10000-c); }
        .note-50000 { color: var(--n50000-c); }

        .note-stack { display: flex; flex-wrap: wrap; justify-content: center; min-height: 35px; width: 100%; }
        .note-stack .real-note { margin-right: clamp(-50px, -7vmin, -30px); transform-origin: center; }
        .note-stack .real-note:last-child { margin-right: 0; }
        .note-stack .real-note:hover { margin-right: 5px; }

        /* DADI E ANIMAZIONI 3D */
        .dice-area { position: absolute; display: flex; gap: clamp(10px, 2vmin, 25px); z-index: 25; perspective: 1000px; }
        @keyframes dice-pulse {
            0% { transform: scale(1) translateY(0); filter: drop-shadow(0 0 0 rgba(255,215,0,0)); }
            100% { transform: scale(1.15) translateY(-1.5vmin); filter: drop-shadow(0 1vmin 2vmin rgba(255,215,0,0.9)); }
        }
        .dice-ready { animation: dice-pulse 1s infinite alternate ease-in-out; cursor: pointer; }
        .die-3d {
            width: clamp(22px, 5.5vmin, 50px); height: clamp(22px, 5.5vmin, 50px); position: relative; transform-style: preserve-3d;
            transition: transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 1vmin 2vmin rgba(0,0,0,0.8); will-change: transform;
        }
        .die-face {
            position: absolute; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(0,0,0,0.9) 100%), repeating-linear-gradient(45deg, #111 0%, #1a1a1a 10%, #111 20%);
            border: clamp(1px, 0.2vmin, 3px) solid #000; border-radius: clamp(3px, 0.8vmin, 8px); display: grid; padding: clamp(2px, 0.5vmin, 5px);
            grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 1px;
            box-shadow: inset 0.2vmin 0.2vmin 0.5vmin rgba(255,255,255,0.2), inset -0.2vmin -0.2vmin 1vmin rgba(0,0,0,0.9); box-sizing: border-box;
        }
        .die-dot { background: radial-gradient(circle at 30% 30%, #fffacd, #d4af37, #8b6508); border-radius: 50%; width: 100%; height: 100%; box-shadow: inset 0.1vmin 0.1vmin 0.4vmin rgba(0,0,0,0.9), 0 0.1vmin 0.1vmin rgba(255,255,255,0.2); }
        .dot-1 { grid-area: 1 / 1; } .dot-3 { grid-area: 1 / 3; } .dot-4 { grid-area: 2 / 1; } .dot-5 { grid-area: 2 / 2; }
        .dot-6 { grid-area: 2 / 3; } .dot-7 { grid-area: 3 / 1; } .dot-9 { grid-area: 3 / 3; }
        
        .face-1 { transform: rotateY(0deg) translateZ(calc(clamp(22px, 5.5vmin, 50px) / 2)); } .face-2 { transform: rotateY(-90deg) translateZ(calc(clamp(22px, 5.5vmin, 50px) / 2)); }
        .face-3 { transform: rotateX(90deg) translateZ(calc(clamp(22px, 5.5vmin, 50px) / 2)); } .face-4 { transform: rotateX(-90deg) translateZ(calc(clamp(22px, 5.5vmin, 50px) / 2)); }
        .face-5 { transform: rotateY(90deg) translateZ(calc(clamp(22px, 5.5vmin, 50px) / 2)); } .face-6 { transform: rotateY(180deg) translateZ(calc(clamp(22px, 5.5vmin, 50px) / 2)); }
        .anim-jump { animation: jump 1.2s ease-out forwards; }
        @keyframes jump { 0% { transform: translateY(0) scale(1); } 40% { transform: translateY(-15vmin) scale(1.3) rotateX(360deg) rotateZ(180deg); } 70% { transform: translateY(-3vmin) scale(1.05); } 100% { transform: translateY(0) scale(1); } }

        .stardust { position: fixed; border-radius: 50%; pointer-events: none; z-index: 999; box-shadow: 0 0 1vmin currentColor; animation: stardust-burst 1s cubic-bezier(0.1, 0.8, 0.3, 1) forwards; }
        @keyframes stardust-burst { 0% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0); opacity: 0; } }

        /* PEDINE EMOJI STILE TELEGRAM 3D */
        .token {
            position: absolute; z-index: 30; width: clamp(26px, 6vmin, 55px); height: clamp(26px, 6vmin, 55px);
            transition: all 0.4s linear; transform: translate(-50%, -50%); will-change: left, top;
        }
        .token-svg { width: 100%; height: 100%; display: block; overflow: visible; filter: drop-shadow(2px 5px 3px rgba(0,0,0,0.7)); }
        
        /* CASETTE E ALBERGHI IN STILE BLOCCHETTI DI LEGNO 3D ORIGINALI */
        .house { 
            width: clamp(5px, 1.2vmin, 14px); height: clamp(5px, 1.2vmin, 14px); 
            background-color: #00a650; border-radius: 1px;
            box-shadow: inset -2px -2px 0px rgba(0,0,0,0.3), inset 2px 2px 0px rgba(255,255,255,0.4), 2px 2px 3px rgba(0,0,0,0.6); 
        }
        .hotel { 
            width: clamp(7px, 1.8vmin, 20px); height: clamp(7px, 1.8vmin, 20px); 
            background-color: #ed1b24; border-radius: 2px;
            box-shadow: inset -3px -3px 0px rgba(0,0,0,0.3), inset 3px 3px 0px rgba(255,255,255,0.4), 2px 2px 3px rgba(0,0,0,0.6); 
        }

        /* MODALI E UI */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center; z-index: 200;
        }
        .modal-box-wrapper { transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); will-change: transform; width: 100%; display: flex; justify-content: center; }
        .modal-box {
            background: #fdfbf7; background-image: var(--paper-tex);
            border: clamp(2px, 0.4vmin, 6px) solid #333; border-radius: 8px;
            width: 95vw; max-width: 480px; max-height: 95vh; padding: clamp(15px, 4vw, 25px); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            color: #111; position: relative; text-align: center; overflow-y: auto; overflow-x: hidden;
            box-sizing: border-box;
        }

        .lang-selector { position: absolute; top: 15px; right: 15px; display: flex; gap: 5px; z-index: 10; }
        .lang-btn { background: #111; color: #fff; border: 1px solid #555; padding: 5px 10px; font-size: 12px; cursor: pointer; border-radius: 4px; font-weight: bold;}
        .lang-btn:hover, .lang-btn.active { background: #ed1b24; border-color: #fff; }

        .card-event {
            padding: clamp(15px, 4vw, 30px) clamp(10px, 3vw, 20px); border: 1px solid rgba(0,0,0,0.2); 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05), 0 4px 10px rgba(0,0,0,0.2);
            margin-bottom: 15px; aspect-ratio: 1.5/1;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-sizing: border-box; width: 100%; background-image: var(--paper-tex);
        }
        .card-event.imprevisti { background-color: var(--impr-color); }
        .card-event.probabilita { background-color: var(--prob-color); }
        .card-event-title { font-size: clamp(16px, 4vw, 1.4rem); font-weight: 800; letter-spacing: 0.15em; font-family: 'Montserrat', sans-serif; margin-bottom: 1rem; color: #222; text-transform: uppercase; }
        .card-event-text { font-size: clamp(14px, 3.5vw, 1.2rem); font-family: 'Playfair Display', serif; color: #222; font-style: italic; line-height: 1.4; word-wrap: break-word; }

        .card-property-original {
            background: #fff; background-image: var(--paper-tex); border: 1px solid #999; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            padding: clamp(5px, 2vw, 10px); margin-bottom: 15px; box-sizing: border-box; width: 100%;
        }
        .cpo-header { border: 2px solid #111; padding: 10px 5px; margin-bottom: 10px; word-wrap: break-word;}
        .cpo-subtitle { font-size: clamp(8px, 2vw, 0.6rem); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .cpo-title { font-size: clamp(16px, 4vw, 1.4rem); font-family: 'Montserrat', sans-serif; font-weight: 800; text-transform: uppercase; line-height:1.1;}
        .cpo-body { font-size: clamp(11px, 3vw, 0.85rem); font-family: sans-serif; line-height: 1.5; padding: 0 5px; text-align: left; }
        .cpo-row { display: flex; justify-content: space-between; margin-bottom: 2px; flex-wrap: wrap;}
        .cpo-row span:last-child { font-weight: bold; }
        .cpo-divider { border-top: 1px solid #ccc; margin: 8px 0; }
        .cpo-footer { font-size: clamp(9px, 2.5vw, 0.75rem); text-align: center; color: #555; }

        .payment-zone {
            background: rgba(0,0,0,0.05); border: 2px dashed #999; border-radius: 8px;
            min-height: 60px; display: flex; flex-wrap: wrap; gap: 8px; padding: 10px;
            justify-content: center; align-items: center; margin-bottom: 15px; box-sizing: border-box; width: 100%;
        }
        .payment-zone .real-note { margin: 0; }

        .btn {
            padding: clamp(10px, 2vw, 12px) clamp(12px, 3vw, 18px); 
            border: 2px solid #111; border-radius: 6px; font-weight: 800;
            cursor: pointer; transition: all 0.2s; background: #eee; text-transform: uppercase;
            width: 100%; margin-top: 5px; font-family: 'Montserrat', sans-serif; box-shadow: 0 4px 0 #111;
            box-sizing: border-box; display: inline-flex; justify-content: center; align-items: center; text-align: center;
            line-height: 1.2; word-wrap: break-word; font-size: clamp(11px, 2.5vw, 14px);
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 0 0 #111; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: 0 4px 0 #111; }
        .btn-buy { background: #00a650; color: white; border-color: #007336; box-shadow: 0 4px 0 #007336; }
        .btn-buy:active { box-shadow: 0 0 0 #007336; }
        .btn-pay { background: #ed1b24; color: white; border-color: #b00f17; box-shadow: 0 4px 0 #b00f17; }
        .btn-pay:active { box-shadow: 0 0 0 #b00f17; }
        .btn-inline { width: auto; flex: 1 1 auto; min-width: 120px; }

        #toast-container {

            const r = (rgb >> 16) & 0xff; const g = (rgb >>  8) & 0xff; const b = (rgb >>  0) & 0xff;

        function getNotesArray(amount) {

            if (rem >= 500) { c100 = 5; rem -= 500; }
            if (rem >= 5000) { c1000 = 5; rem -= 5000; }
            if (rem >= 40000) { c10000 = 4; rem -= 40000; }
            
            c50000 += Math.floor(rem / 50000); rem %= 50000;
            c10000 += Math.floor(rem / 10000); rem %= 10000;
            c1000 += Math.floor(rem / 1000); rem %= 1000;
            c100 += Math.floor(rem / 100); rem %= 100;
            
            const addN = (val, count) => { for(let i=0; i<count; i++) notes.push(val); };
            addN(50000, c50000); addN(10000, c10000); addN(1000, c1000); addN(100, c100);
            return notes;
        }

        function openPayment(amount, reason, callback) {

        function renderPaymentUI() {
            document.getElementById('pay-desc').innerHTML = `${t('pay_req')} <b>L. ${currentPayment.amount.toLocaleString('it-IT')}</b>`;
            
            const trayDiv = document.getElementById('pay-tray');
            trayDiv.innerHTML = currentPayment.tray.length === 0 ? `<span class="text-gray-400 text-sm">${t('tap_notes')}</span>` : '';
            currentPayment.tray.forEach((val, i) => trayDiv.innerHTML += createNoteHTML(val, `moveNoteToWallet(${i})`, 'animation: jump 0.2s ease-out;'));

            const walletDiv = document.getElementById('pay-wallet');
            walletDiv.innerHTML = currentPayment.wallet.length === 0 ? `<span class="text-gray-400 text-sm">${t('empty')}</span>` : '';
            currentPayment.wallet.forEach((val, i) => walletDiv.innerHTML += createNoteHTML(val, `moveNoteToTray(${i})`));

            const sumEl = document.getElementById('tray-sum'); sumEl.innerText = `L. ${currentPayment.traySum.toLocaleString('it-IT')}`;
            const btnConfirm = document.getElementById('btn-confirm-pay');
            
            if (currentPayment.traySum >= currentPayment.amount) {

            } else {

            }
        }

        function updateTokens() {

            gameState.players.forEach(p => {
                const cell = document.getElementById(`cell-${p.pos}`); if(!cell) return;

                const tEl = document.getElementById(`token-${p.id}`);
                tEl.style.left = `${(rect.left - parentRect.left) + rect.width/2 + offsetX}px`;

        const diceRots = { 1: {x: 0, y: 0}, 2: {x: 0, y: 90}, 3: {x: -90, y: 0}, 4: {x: 90, y: 0}, 5: {x: 0, y: -90}, 6: {x: 180, y: 0} };
        function createStardust() {
            const diceArea = document.getElementById('dice-area'); const rect = diceArea.getBoundingClientRect();

        function rollDice() {
            const diceArea = document.getElementById('dice-area');
            if(!diceArea.classList.contains('dice-ready') || gameState.isMoving) return;
            diceArea.classList.remove('dice-ready'); createStardust();
            
            const p = gameState.players[gameState.currentPlayerIdx];
            if(p.inJail) {
                p.jailTurns++;
                if(p.jailTurns > 3) { p.inJail = false; p.jailTurns = 0; payBankActive(5000); return; } 
                else { setTimeout(() => endTurn(), 1000); return; }
            }

            gameState.isMoving = true;
            const val1 = Math.floor(Math.random() * 6) + 1; const val2 = Math.floor(Math.random() * 6) + 1;
            gameState.lastRoll = val1 + val2;

            const d1El = document.getElementById('die1'); const d2El = document.getElementById('die2');

            b1.classList.remove('anim-jump'); b2.classList.remove('anim-jump'); void b1.offsetWidth; void b2.offsetWidth;
            b1.classList.add('anim-jump'); b2.classList.add('anim-jump');

            const spin = () => Math.floor(Math.random() * 2 + 2) * 360;
            d1El.style.transform = `rotateX(${diceRots[val1].x + spin()}deg) rotateY(${diceRots[val1].y + spin()}deg)`;
            d2El.style.transform = `rotateX(${diceRots[val2].x + spin()}deg) rotateY(${diceRots[val2].y + spin()}deg)`;

            setTimeout(() => { stepMove(p, gameState.lastRoll); }, 1200);
        }

            updateTokens(); setTimeout(() => stepMove(player, stepsLeft - 1), 400);

                const headerColor = cell.color || '#333'; const fontCol = isLightColor(headerColor) ? '#111' : '#fff';
                html += `
                    <div class="card-property-original">
                        <div class="cpo-header" style="background-color: ${headerColor}; color: ${fontCol};">
                            <div class="cpo-subtitle">${cell.type === 'property' ? t('prop_title') : ''}</div>
                            <div class="cpo-title">${cell.name}</div>
                        </div>
                        <div class="cpo-body">
                            ${cell.type === 'property' ? `
                                <div class="cpo-row mb-2"><span>${t('rent_base')}</span> <span>L. ${cell.rent[0]}</span></div>
                                <div class="cpo-row"><span>${t('with_house')} 1 ${t('house')}</span> <span>L. ${cell.rent[1]}</span></div>
                                <div class="cpo-row"><span>${t('with_house')} 2 ${t('houses')}</span> <span>L. ${cell.rent[2]}</span></div>
                                <div class="cpo-row"><span>${t('with_house')} 3 ${t('houses')}</span> <span>L. ${cell.rent[3]}</span></div>
                                <div class="cpo-row"><span>${t('with_house')} 4 ${t('houses')}</span> <span>L. ${cell.rent[4]}</span></div>
                                <div class="cpo-row mt-2" style="font-size: 0.95rem;"><span>${t('with_house')} ${t('hotel')}</span> <span>L. ${cell.rent[5]}</span></div>
                                <div class="cpo-divider"></div>
                                <div class="cpo-footer">${t('mortgage')} L. ${cell.price / 2}<br>${t('house_cost')} L. ${cell.houseCost}</div>
                            ` : `<div class="text-center font-bold text-lg mb-2">${t('val_msg')} L. ${cell.price}</div><div class="text-center italic">${t('var_rent')}</div>`}
                        </div>
                    </div>`;

                if (!propState.ownerId) {
                    html += `
                        <div class="flex gap-2">
                            <button class="btn btn-buy btn-inline" onclick="buyProperty(${cell.id})">${t('buy_btn')} (L. ${cell.price})</button>
                            <button class="btn btn-inline" onclick="endTurn()">${t('pass_btn')}</button>
                        </div>`;
                } else if (propState.ownerId !== player.id) {
                    const owner = gameState.players.find(p => p.id === propState.ownerId); const rent = calculateRent(cell, propState);
                    html += `
                        <p class="mb-3 text-red-600 font-bold text-lg">${t('prop_of')} ${owner.name}</p>
                        <button class="btn btn-pay" onclick="payRent(${cell.id}, ${rent})">${t('pay_btn')} L. ${rent}</button>`;
                } else if (cell.type === 'property' && propState.level < 5) {
                    html += `
                        <p class="mb-3 text-green-600 font-bold">${t('your_prop')}</p>
                        <div class="flex gap-2">
                            <button class="btn btn-buy btn-inline" onclick="buildHouse(${cell.id})">${t('build_btn')} (L. ${cell.houseCost})</button>
                            <button class="btn btn-inline" onclick="endTurn()">${t('end_turn')}</button>
                        </div>`;
                } else { html += `<button class="btn" onclick="endTurn()">${t('end_turn')}</button>`; }
            } else if (cell.type === 'chance' || cell.type === 'chest') {
                const isProb = cell.type === 'chance'; const deck = isProb ? getProbDeck() : getImprDeck();
                const card = deck[Math.floor(Math.random() * deck.length)];
                html += `
                    <div class="card-event ${isProb ? 'probabilita' : 'imprevisti'}">
                        <div class="card-event-title">${isProb ? t('chance_title') : t('chest_title')}</div>
                        <div class="card-event-text">"${card.txt}"</div>
                    </div>
                    <button class="btn" onclick="resolveCard(${deck.indexOf(card)}, '${cell.type}')">${t('ok_btn')}</button>`;
            } else if (cell.type === 'tax') {
                html += `
                    <h2 class="text-xl font-bold mb-3 text-red-600 font-['Montserrat']">${cell.name}</h2>
                    <p class="mb-4 text-lg font-bold">${cell.desc}</p>
                    <button class="btn btn-pay" onclick="payBankActive(${cell.cost})">${t('pay_btn')} L. ${cell.cost}</button>`;
            } else if (cell.id === 30) {
                html += `
                    <h2 class="text-xl font-bold mb-3 text-red-600 font-['Montserrat']">${t('go_jail')}</h2>
                    <button class="btn" onclick="goToJailActive()">${t('go_jail')}</button>`;
            } else {
                html += `<h2 class="text-xl font-bold mb-3 font-['Montserrat']">${cell.name}</h2><button class="btn" onclick="endTurn()">${t('ok_btn')}</button>`;
            }
            openModal(html);
        }

        function calculateRent(cell, propState) {
            if (cell.type === 'property') return cell.rent[propState.level];
            if (cell.type === 'station') return 2500 * Math.pow(2, [5,15,25,35].filter(id => gameState.properties[id].ownerId === propState.ownerId).length - 1);
            if (cell.type === 'utility') return gameState.lastRoll * ([12,28].filter(id => gameState.properties[id].ownerId === propState.ownerId).length === 2 ? 1000 : 400);
            return 0;
        }

        function buyProperty(cellId) {
            const p = gameState.players[gameState.currentPlayerIdx]; const cell = getBoardData().find(c => c.id === cellId);
            openPayment(cell.price, `${t('buy_title')} ${cell.name}`, () => {
                p.balance -= cell.price; gameState.properties[cellId].ownerId = p.id;
                document.getElementById(`cell-${cellId}`).style.borderBottom = `clamp(3px, 0.6vmin, 6px) solid ${cell.color || '#333'}`;
                updateDashboard(); endTurn();
            });
        }
        function payRent(cellId, amount) {
            const p = gameState.players[gameState.currentPlayerIdx]; const ownerId = gameState.properties[cellId].ownerId;
            openPayment(amount, t('rent_title'), () => {
                p.balance -= amount; gameState.players.find(x => x.id === ownerId).balance += amount;
                updateDashboard(); endTurn();
            });
        }
        function buildHouse(cellId) {
            const p = gameState.players[gameState.currentPlayerIdx]; const cell = getBoardData().find(c => c.id === cellId);
            openPayment(cell.houseCost, t('build_title'), () => {
                p.balance -= cell.houseCost; const propState = gameState.properties[cellId]; propState.level++;
                const cb = document.getElementById(`cb-${cellId}`); cb.innerHTML = '';
                if(propState.level === 5) cb.innerHTML = `<div class="hotel"></div>`;
                else for(let i=0; i<propState.level; i++) cb.innerHTML += `<div class="house"></div>`;
                updateDashboard(); endTurn();
            });
        }
        function resolveCard(cardIdx, type) {
            const card = (type === 'chance' ? getProbDeck() : getImprDeck())[cardIdx]; closeModal(); card.action(gameState.players[gameState.currentPlayerIdx]);
            if(!card.action.toString().includes('movePlayerTo') && !card.action.toString().includes('payBankActive')) endTurn();
        }
        function payBankActive(amount) { 
            openPayment(amount, t('tax_title'), () => { gameState.players[gameState.currentPlayerIdx].balance -= amount; updateDashboard(); endTurn(); });
        }
        function receiveMoney(player, amount) { player.balance += amount; updateDashboard(); }
        function goToJailActive() { closeModal(); goToJail(gameState.players[gameState.currentPlayerIdx]); }

        function endTurn() {
            closeModal(); gameState.isMoving = false;
            if(gameState.players[gameState.currentPlayerIdx].balance < 0) showToast(`⚠️ ${t('bankrupt_msg')} ${gameState.players[gameState.currentPlayerIdx].name}!`);
            gameState.currentPlayerIdx = (gameState.currentPlayerIdx + 1) % gameState.players.length;
            orientBoard(); updateDashboard(); setTimeout(() => { document.getElementById('dice-area').classList.add('dice-ready'); }, 800);
        }

        function openModal(contentHtml) { document.getElementById('action-content').innerHTML = contentHtml; document.getElementById('modal-action').style.display = 'flex'; }
        function closeModal() { document.getElementById('modal-action').style.display = 'none'; }

        window.onload = () => { setLang('it'); addSetupPlayer(); addSetupPlayer(); };
    </script>
</body>
</html>
