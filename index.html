<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Monopoli - Edizione Classica Tabletop">
    <title>Monopoli - Edizione Classica Tabletop</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Rye&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Colori Originali Editrice Giochi */
            --bg-board: #c1d6c8; 
            --border-color: #111;
            --brown: #8e4a23; --lightblue: #9bd2f0; --pink: #d93c96;
            --orange: #f7941d; --red: #ed1b24; --yellow: #fff200;
            --green: #00a650; --darkblue: #0054a6;
            --prob-color: #e6ebc8; --impr-color: #f79759;
            
            /* Texture Carta leggerissima generata via Data URI per performance istantanee */
            --paper-tex: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.06'/%3E%3C/svg%3E");
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at center, #2e4732 0%, #0a120c 100%);
            color: #111; margin: 0; padding: 0;
            overflow: hidden; touch-action: none; user-select: none;
            -webkit-user-select: none; -moz-user-select: none;
            -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
        }

        #app-container {
            display: flex; align-items: center; justify-content: center;
            width: 100vw; height: 100vh; position: relative;
        }

        /* TABELLONE SCALABILE (Quadrato perfetto, mai tagliato) */
        #board-area {
            position: relative; display: flex; align-items: center; justify-content: center;
            width: min(96vw, 96vh); height: min(96vw, 96vh);
            box-shadow: 0 10px 40px rgba(0,0,0,0.9), 0 0 0 clamp(2px, 1vmin, 8px) #eaddcd;
            background-color: var(--border-color); border-radius: 4px;
            contain: layout style paint;
        }

        #board {
            width: 100%; height: 100%; display: grid;
            /* Angoli leggermente più larghi come nel gioco fisico (14%) */
            grid-template-columns: 14% repeat(9, 1fr) 14%;
            grid-template-rows: 14% repeat(9, 1fr) 14%;
            gap: clamp(1px, 0.2vmin, 2px);
            background-color: var(--border-color); padding: clamp(1px, 0.2vmin, 2px);
            border-radius: 2px;
        }

        .cell {
            background-color: var(--bg-board); background-image: var(--paper-tex);
            position: relative; display: flex; overflow: hidden; box-sizing: border-box;
        }

        /* Gestione rigorosa dei contenuti interni per prevenire sbavature */
        .cell-content {
            width: 100%; height: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: space-between; text-align: center;
            transform-origin: center center; padding: 0; box-sizing: border-box;
        }

        .bottom-row .cell-content { transform: rotate(0deg); }
        .left-col .cell-content { transform: rotate(90deg); }
        .top-row .cell-content { transform: rotate(180deg); }
        .right-col .cell-content { transform: rotate(-90deg); }

        .cell.corner { justify-content: center; align-items: center; }
        .cell.corner .cell-content { justify-content: center; padding: 5%; }
        #cell-0 .cell-content { transform: rotate(-45deg); }
        #cell-10 .cell-content { transform: rotate(45deg); }
        #cell-20 .cell-content { transform: rotate(135deg); }
        #cell-30 .cell-content { transform: rotate(-135deg); }

        .color-bar {
            width: 100%; height: 21%; min-height: 4px;
            border-bottom: clamp(1px, 0.2vmin, 3px) solid #111; 
            flex-shrink: 0; box-shadow: inset 0 -2px 4px rgba(0,0,0,0.15);
        }

        /* Testi adattivi compressi fluidamente */
        .property-name {
            font-weight: 700; font-size: clamp(6px, 1.1vmin, 14px); line-height: 1.05;
            text-transform: uppercase; padding: 2px 2%; margin: auto 0;
            font-family: 'Montserrat', sans-serif; letter-spacing: -0.03em;
            word-wrap: break-word; overflow-wrap: break-word; text-align: center;
            display: flex; align-items: center; justify-content: center; flex-grow: 1;
            max-height: 50%; overflow: hidden;
        }

        .property-price {
            font-size: clamp(5px, 0.9vmin, 12px); font-weight: bold; 
            margin-bottom: 2%; flex-shrink: 0; letter-spacing: -0.02em;
        }

        .icon-large { font-size: clamp(12px, 3vmin, 35px); margin: auto; flex-shrink: 0; }
        .svg-board-icon { 
            width: clamp(14px, 3.5vmin, 40px); height: clamp(14px, 3.5vmin, 40px); 
            margin: auto; display: block; filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.3)); 
            flex-shrink: 0;
        }
        
        #center-board {
            grid-column: 2 / span 9; grid-row: 2 / span 9;
            background-color: var(--bg-board); background-image: var(--paper-tex);
            position: relative; transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: center center; display: flex;
            align-items: center; justify-content: center; overflow: hidden;
            will-change: transform; border-radius: 2px;
            box-shadow: inset 0 0 5vmin rgba(0,0,0,0.1);
        }

        .logo-container {
            position: absolute; background: #ed1b24; color: white;
            padding: clamp(6px, 1.2vmin, 15px) clamp(15px, 3.5vmin, 40px); 
            border: clamp(2px, 0.5vmin, 6px) solid white;
            font-size: clamp(18px, 4.8vmin, 60px); font-family: 'Montserrat', sans-serif;
            font-weight: 800; letter-spacing: 0.15em;
            box-shadow: 0 0 0 clamp(1px, 0.3vmin, 4px) #111, clamp(2px, 0.5vmin, 8px) clamp(2px, 0.5vmin, 8px) clamp(4px, 1vmin, 12px) rgba(0,0,0,0.4);
            transform: rotate(-45deg); z-index: 5; text-shadow: 2px 2px 0 #900;
        }

        .deck {
            position: absolute; width: 19vmin; height: 11.5vmin;
            min-width: 60px; min-height: 40px; border-radius: 4px;
            border: clamp(1px, 0.2vmin, 3px) dashed rgba(0,0,0,0.5); display: flex; flex-direction: column;
            justify-content: center; align-items: center; background-image: var(--paper-tex);
        }
        .deck-imprevisti { top: 12%; left: 12%; transform: rotate(135deg); background-color: var(--impr-color); box-shadow: 0.3vmin 0.3vmin 1.5vmin rgba(0,0,0,0.4); }
        .deck-probabilita { bottom: 12%; right: 12%; transform: rotate(-45deg); background-color: var(--prob-color); box-shadow: 0.3vmin 0.3vmin 1.5vmin rgba(0,0,0,0.4); }
        .deck-title { font-size: clamp(8px, 1.8vmin, 18px); font-weight: 800; letter-spacing: 0.05em; font-family: 'Montserrat', sans-serif; color:#111; }
        .deck-q { font-size: clamp(16px, 4vmin, 40px); font-family: 'Playfair Display', serif; font-weight: bold; opacity: 0.5; color:#111; }

        /* EFFETTO POLVERE DI STELLE */
        .stardust {
            position: fixed; border-radius: 50%; pointer-events: none; z-index: 999;
            box-shadow: 0 0 1vmin currentColor;
            animation: stardust-burst 1s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }
        @keyframes stardust-burst {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0); opacity: 0; }
        }

        /* DADI 3D EFFETTO LEGNO NERO E ORO */
        .dice-area { position: absolute; display: flex; gap: clamp(10px, 2.5vmin, 30px); z-index: 20; perspective: 1000px; }
        @keyframes dice-pulse {
            0% { transform: scale(1) translateY(0); filter: drop-shadow(0 0 0 rgba(255,215,0,0)); }
            100% { transform: scale(1.1) translateY(-1vmin); filter: drop-shadow(0 1vmin 2vmin rgba(255,215,0,0.8)); }
        }
        .dice-ready { animation: dice-pulse 1s infinite alternate ease-in-out; cursor: pointer; }
        .die-3d {
            width: clamp(25px, 5.5vmin, 60px); height: clamp(25px, 5.5vmin, 60px); position: relative; transform-style: preserve-3d;
            transition: transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 1vmin 2vmin rgba(0,0,0,0.8); will-change: transform;
        }
        .die-face {
            position: absolute; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(0,0,0,0.9) 100%),
                        repeating-linear-gradient(45deg, #111 0%, #1a1a1a 10%, #111 20%);
            border: clamp(1px, 0.2vmin, 3px) solid #000; border-radius: clamp(3px, 1vmin, 10px); display: grid; padding: clamp(2px, 0.5vmin, 6px);
            grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 1px;
            box-shadow: inset 0.2vmin 0.2vmin 0.5vmin rgba(255,255,255,0.2), inset -0.2vmin -0.2vmin 1vmin rgba(0,0,0,0.9);
            box-sizing: border-box;
        }
        .die-dot { 
            background: radial-gradient(circle at 30% 30%, #fffacd, #d4af37, #8b6508);
            border-radius: 50%; width: 100%; height: 100%; 
            box-shadow: inset 0.1vmin 0.1vmin 0.4vmin rgba(0,0,0,0.9), 0 0.1vmin 0.1vmin rgba(255,255,255,0.2); 
        }
        .dot-1 { grid-area: 1 / 1; } .dot-3 { grid-area: 1 / 3; } .dot-4 { grid-area: 2 / 1; } .dot-5 { grid-area: 2 / 2; }
        .dot-6 { grid-area: 2 / 3; } .dot-7 { grid-area: 3 / 1; } .dot-9 { grid-area: 3 / 3; }
        
        .face-1 { transform: rotateY(0deg) translateZ(calc(clamp(25px, 5.5vmin, 60px) / 2)); } 
        .face-2 { transform: rotateY(-90deg) translateZ(calc(clamp(25px, 5.5vmin, 60px) / 2)); }
        .face-3 { transform: rotateX(90deg) translateZ(calc(clamp(25px, 5.5vmin, 60px) / 2)); } 
        .face-4 { transform: rotateX(-90deg) translateZ(calc(clamp(25px, 5.5vmin, 60px) / 2)); }
        .face-5 { transform: rotateY(90deg) translateZ(calc(clamp(25px, 5.5vmin, 60px) / 2)); } 
        .face-6 { transform: rotateY(180deg) translateZ(calc(clamp(25px, 5.5vmin, 60px) / 2)); }
        .anim-jump { animation: jump 1.2s ease-out forwards; }
        @keyframes jump {
            0% { transform: translateY(0) scale(1); }
            40% { transform: translateY(-15vmin) scale(1.3) rotateX(360deg) rotateZ(180deg); }
            70% { transform: translateY(-3vmin) scale(1.05); }
            100% { transform: translateY(0) scale(1); }
        }

        /* PEDINE & EDIFICI */
        .token {
            position: absolute; z-index: 30;
            width: clamp(20px, 4.5vmin, 45px); height: clamp(20px, 4.5vmin, 45px);
            filter: drop-shadow(0 0.5vmin 0.5vmin rgba(0,0,0,0.6)) drop-shadow(0 0.2vmin 0.1vmin rgba(0,0,0,0.8));
            transition: all 0.4s linear; transform: translate(-50%, -50%); will-change: left, top;
        }
        .token-svg { width: 100%; height: 100%; display: block; }
        
        .house { width: clamp(6px, 1.4vmin, 16px); height: clamp(6px, 1.4vmin, 16px); background-color: #00a650; border: 1px solid #000; box-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        .hotel { width: clamp(8px, 2vmin, 22px); height: clamp(8px, 2vmin, 22px); background-color: #ed1b24; border: 1px solid #000; box-shadow: 1px 1px 2px rgba(0,0,0,0.5); }

        /* CASSA BANCO */
        #bank-tray {
            position: fixed; top: 10px; right: 10px; z-index: 90;
            background: linear-gradient(135deg, #e53935 0%, #b71c1c 100%);
            border: 2px solid #900; border-radius: 12px;
            padding: 10px; display: flex; gap: 6px;
            box-shadow: inset 4px 4px 10px rgba(255,255,255,0.2), inset -4px -4px 10px rgba(0,0,0,0.4), 0 5px 15px rgba(0,0,0,0.6);
            pointer-events: none; max-width: 40vw; flex-wrap: wrap; justify-content: flex-end;
        }
        .bank-slot {
            background: #8e0000; border-radius: 6px;
            width: clamp(50px, 8vmin, 80px); height: clamp(35px, 5.5vmin, 55px);
            position: relative;
            box-shadow: inset 3px 3px 8px rgba(0,0,0,0.8), inset -2px -2px 5px rgba(255,255,255,0.1);
        }
        .bank-slot .real-note {
            width: 90%; height: 90%; position: absolute; bottom: 5%; left: 5%;
            font-size: clamp(8px, 1.5vmin, 14px); box-shadow: -1px -1px 3px rgba(0,0,0,0.5);
        }

        /* MODALI OTTIMIZZATI */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center; z-index: 200;
        }
        .modal-box-wrapper { transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); will-change: transform; width: 100%; display: flex; justify-content: center; }
        .modal-box {
            background: #fdfbf7; background-image: var(--paper-tex);
            border: clamp(2px, 0.4vmin, 6px) solid #333; border-radius: 8px;
            width: 95vw; max-width: 480px; max-height: 95vh; padding: clamp(15px, 4vw, 25px); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            color: #111; position: relative; text-align: center; overflow-y: auto; overflow-x: hidden;
            box-sizing: border-box;
        }

        /* SCELTA PEDINE SETUP */
        .token-option {
            width: clamp(40px, 8vw, 60px); height: clamp(40px, 8vw, 60px);
            display: flex; align-items: center; justify-content: center;
            border: 2px solid transparent; border-radius: 8px; cursor: pointer; transition: 0.2s;
            background: rgba(0,0,0,0.05); flex-shrink: 0;
        }
        .token-option:hover { background: rgba(0,0,0,0.1); transform: translateY(-2px); }
        .token-option.selected { border-color: #ed1b24; background: #ffebee; transform: scale(1.1); box-shadow: 0 4px 10px rgba(237,27,36,0.3); }
        .token-svg-setup { width: 85%; height: 85%; filter: drop-shadow(2px 3px 2px rgba(0,0,0,0.4)); display: block; pointer-events: none;}

        /* CARTE ED EVENTI */
        .card-event {
            padding: clamp(15px, 4vw, 30px) clamp(10px, 3vw, 20px); border: 1px solid rgba(0,0,0,0.2); 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05), 0 4px 10px rgba(0,0,0,0.2);
            margin-bottom: 15px; aspect-ratio: 1.5/1;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-sizing: border-box; width: 100%; background-image: var(--paper-tex);
        }
        .card-event.imprevisti { background-color: var(--impr-color); }
        .card-event.probabilita { background-color: var(--prob-color); }
        .card-event-title { font-size: clamp(16px, 4vw, 1.4rem); font-weight: 800; letter-spacing: 0.15em; font-family: 'Montserrat', sans-serif; margin-bottom: 1rem; color: #222; text-transform: uppercase; }
        .card-event-text { font-size: clamp(14px, 3.5vw, 1.2rem); font-family: 'Playfair Display', serif; color: #222; font-style: italic; line-height: 1.4; word-wrap: break-word; }

        .card-property-original {
            background: #fff; background-image: var(--paper-tex); border: 1px solid #999; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            padding: clamp(5px, 2vw, 10px); margin-bottom: 15px; box-sizing: border-box; width: 100%;
        }
        .cpo-header { border: 2px solid #111; padding: 10px 5px; margin-bottom: 10px; word-wrap: break-word;}
        .cpo-subtitle { font-size: clamp(8px, 2vw, 0.6rem); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .cpo-title { font-size: clamp(16px, 4vw, 1.4rem); font-family: 'Montserrat', sans-serif; font-weight: 800; text-transform: uppercase; line-height:1.1;}
        .cpo-body { font-size: clamp(11px, 3vw, 0.85rem); font-family: sans-serif; line-height: 1.5; padding: 0 5px; text-align: left; }
        .cpo-row { display: flex; justify-content: space-between; margin-bottom: 2px; flex-wrap: wrap;}
        .cpo-row span:last-child { font-weight: bold; }
        .cpo-divider { border-top: 1px solid #ccc; margin: 8px 0; }
        .cpo-footer { font-size: clamp(9px, 2.5vw, 0.75rem); text-align: center; color: #555; }

        /* BANCONOTE 3D */
        .real-note {
            width: clamp(60px, 12vw, 100px); height: clamp(30px, 6vw, 50px);
            border-radius: 4px; border: 1px solid rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Rye', cursive; font-weight: bold; font-size: clamp(10px, 2vw, 16px); color: #111;
            position: relative; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 2px 3px 5px rgba(0,0,0,0.4); user-select: none; flex-shrink: 0; box-sizing: border-box;
            background-image: var(--paper-tex);
        }
        .real-note::before { content: ''; position: absolute; top: 2px; left: 2px; right: 2px; bottom: 2px; border: 1px dashed rgba(0,0,0,0.4); border-radius: 2px; pointer-events: none; }
        .real-note:hover { transform: translateY(-4px) scale(1.05); box-shadow: 4px 6px 10px rgba(0,0,0,0.5); z-index: 10; }
        
        .note-bg-100 { background-color: #aadbed; background: radial-gradient(ellipse at center, #fff 10%, #aadbed 90%); }
        .note-bg-1000 { background-color: #aee0b6; background: radial-gradient(ellipse at center, #fff 10%, #aee0b6 90%); }
        .note-bg-10000 { background-color: #d7cdb9; background: radial-gradient(ellipse at center, #fff 10%, #d7cdb9 90%); }
        .note-bg-50000 { background-color: #f6c0c4; background: radial-gradient(ellipse at center, #fff 10%, #f6c0c4 90%); }

        .note-val-badge { background: rgba(255,255,255,0.85); padding: 1px 6px; border-radius: 50px; border: 1px solid #555; font-family: 'Montserrat', sans-serif; font-size: 0.85em; }

        .note-stack { display: flex; flex-wrap: wrap; margin-top: 5px; min-height: 35px; }
        .note-stack .real-note { margin-right: clamp(-30px, -6vw, -20px); margin-bottom: -15px; transform-origin: center; }
        .note-stack .real-note:hover { margin-right: 5px; transform: scale(1.2) translateY(-10px); }

        .payment-zone {
            background: rgba(0,0,0,0.05); border: 2px dashed #999; border-radius: 8px;
            min-height: 60px; display: flex; flex-wrap: wrap; gap: 8px; padding: 10px;
            justify-content: center; align-items: center; margin-bottom: 15px; box-sizing: border-box; width: 100%;
        }
        .payment-zone .real-note { margin: 0; }

        /* PULSANTI RESPONSIVI */
        .modal-box .flex.gap-2 { flex-wrap: wrap; justify-content: center; width: 100%; }
        .btn {
            padding: clamp(10px, 2vw, 12px) clamp(12px, 3vw, 18px); 
            border: 2px solid #111; border-radius: 6px; font-weight: 800;
            cursor: pointer; transition: all 0.2s; background: #eee; text-transform: uppercase;
            width: 100%; margin-top: 5px; font-family: 'Montserrat', sans-serif; box-shadow: 0 4px 0 #111;
            box-sizing: border-box; display: inline-flex; justify-content: center; align-items: center; text-align: center;
            line-height: 1.2; word-wrap: break-word; font-size: clamp(11px, 2.5vw, 14px);
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 0 0 #111; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: 0 4px 0 #111; }
        .btn-buy { background: #00a650; color: white; border-color: #007336; box-shadow: 0 4px 0 #007336; }
        .btn-buy:active { box-shadow: 0 0 0 #007336; }
        .btn-pay { background: #ed1b24; color: white; border-color: #b00f17; box-shadow: 0 4px 0 #b00f17; }
        .btn-pay:active { box-shadow: 0 0 0 #b00f17; }
        .btn-inline { width: auto; flex: 1 1 auto; min-width: 120px; }

        /* DASHBOARD GIOCATORI */
        #dashboard {
            position: fixed; top: 10px; left: 10px; z-index: 100;
            display: flex; flex-direction: column; gap: 10px; pointer-events: none;
            max-width: 100vw; box-sizing: border-box;
        }
        .player-card {
            background: rgba(255,255,255,0.95); border: 2px solid #333; border-radius: 8px;
            padding: clamp(6px, 1.5vw, 12px); min-width: clamp(120px, 25vw, 220px); box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            transition: transform 0.3s, border-color 0.3s; pointer-events: auto; box-sizing: border-box;
        }
        .player-card.active { transform: scale(1.05); border-color: #ed1b24; border-width: 3px; }
        .player-name { display:flex; align-items:center; gap:6px; font-size: clamp(12px, 3vw, 16px); font-weight: bold; font-family: 'Montserrat', sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .dash-token { width: clamp(16px, 4vw, 24px); height: clamp(16px, 4vw, 24px); display: inline-block; filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.4)); flex-shrink: 0;}
        .player-balance { font-size: clamp(14px, 3.5vw, 18px); font-weight: bold; color: #00a650; margin-bottom: 4px; }

        /* NOTIFICHE CUSTOM (Sostituiscono alert) */
        #toast-container {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 1000; display: flex; flex-direction: column; gap: 10px; pointer-events: none;
        }
        .toast {
            background: #111; color: #fff; padding: 12px 24px; border-radius: 8px;
            font-family: 'Montserrat', sans-serif; font-weight: bold; font-size: 14px;

            return (0.2126 * r + 0.7152 * g + 0.0722 * b) > 128;
        }

            addN(10000, Math.floor(rem / 10000)); rem %= 10000;
            addN(1000,  Math.floor(rem / 1000));  rem %= 1000;
            addN(100,   Math.floor(rem / 100));   rem %= 100;
            return notes;

            document.getElementById('pay-desc').innerHTML = `Devi versare: <b>L. ${currentPayment.amount.toLocaleString('it-IT')}</b>`;
            
            const trayDiv = document.getElementById('pay-tray');
            trayDiv.innerHTML = currentPayment.tray.length === 0 ? '<span class="text-gray-400 text-sm">Tocca le banconote</span>' : '';
            currentPayment.tray.forEach((val, i) => trayDiv.innerHTML += createNoteHTML(val, `moveNoteToWallet(${i})`, 'animation: jump 0.2s ease-out;'));

            const walletDiv = document.getElementById('pay-wallet');
            walletDiv.innerHTML = currentPayment.wallet.length === 0 ? '<span class="text-gray-400 text-sm">Vuoto</span>' : '';
            currentPayment.wallet.forEach((val, i) => walletDiv.innerHTML += createNoteHTML(val, `moveNoteToTray(${i})`));

            const sumEl = document.getElementById('tray-sum'); sumEl.innerText = `L. ${currentPayment.traySum.toLocaleString('it-IT')}`;
            const btnConfirm = document.getElementById('btn-confirm-pay');
            
            if (currentPayment.traySum >= currentPayment.amount) {
                sumEl.className = "float-right text-green-600 font-bold text-lg"; btnConfirm.disabled = false;
                const change = currentPayment.traySum - currentPayment.amount;
                btnConfirm.innerText = change > 0 ? `PAGA E RICEVI L. ${change.toLocaleString()} DI RESTO` : `PAGA L. ${currentPayment.amount.toLocaleString()}`;
            } else {
                sumEl.className = "float-right text-red-600 font-bold text-lg"; btnConfirm.disabled = true; btnConfirm.innerText = `CONFERMA PAGAMENTO`;
            }
        }

        function moveNoteToTray(index) { const val = currentPayment.wallet.splice(index, 1)[0]; currentPayment.tray.push(val); currentPayment.traySum += val; renderPaymentUI(); }
        function moveNoteToWallet(index) { const val = currentPayment.tray.splice(index, 1)[0]; currentPayment.wallet.push(val); currentPayment.traySum -= val; renderPaymentUI(); }
        function confirmPayment() { if (currentPayment.traySum >= currentPayment.amount) { document.getElementById('modal-payment').style.display = 'none'; currentPayment.callback(); } }
        function cancelPayment() { document.getElementById('modal-payment').style.display = 'none'; endTurn(); }

        // --- INIZIALIZZAZIONE E UI ---
        function initBank() {
            const bankVals = [50000, 10000, 1000, 100];
            let trayHTML = '';
            bankVals.forEach(v => {
                trayHTML += `<div class="bank-slot">`;
                for(let i=0; i<6; i++) {
                    trayHTML += createNoteHTML(v, '', `position:absolute; bottom:${i*2}px; left:${i*2}px; z-index:${i};`);
                }
                trayHTML += `</div>`;
            });
            document.getElementById('bank-tray').innerHTML = trayHTML;
        }

        function initBoard() {
            const board = document.getElementById('board'); const fragment = document.createDocumentFragment(); 
            boardData.forEach(data => {
                const cell = document.createElement('div'); cell.className = `cell ${data.type === 'corner' ? 'corner' : ''}`; cell.id = `cell-${data.id}`;
                const pos = cellPos[data.id]; cell.style.gridColumn = pos.c; cell.style.gridRow = pos.r;
                cell.classList.add(data.id > 0 && data.id < 10 ? "bottom-row" : data.id > 10 && data.id < 20 ? "left-col" : data.id > 20 && data.id < 30 ? "top-row" : data.id > 30 && data.id < 40 ? "right-col" : "none");

                let html = `<div class="cell-content">`;
                if (data.type === 'property') {
                    html += `<div class="color-bar" id="cb-${data.id}" style="background-color: ${data.color};"></div><div class="property-name">${data.name}</div><div class="property-price">L. ${data.price}</div>`;
                } else if (data.type === 'corner') {
                    html += `<div class="icon-large">${data.icon}</div><div class="property-name">${data.name}</div>`;
                } else {
                    html += `<div class="property-name mt-1 mb-1">${data.name}</div>${data.svg ? data.svg : `<div class="icon-large">${data.icon}</div>`}`;
                    if(data.price || data.cost) html += `<div class="property-price">L. ${data.price || data.cost}</div>`;
                }
                html += `</div>`; cell.innerHTML = html; fragment.appendChild(cell);
                if(data.type === 'property' || data.type === 'station' || data.type === 'utility') gameState.properties[data.id] = { ownerId: null, level: 0 };
            });
            board.appendChild(fragment);
            initBank();
        }

        let setupPlayerCount = 0;
        function addSetupPlayer() {
            if(setupPlayerCount >= 6) { showToast("Massimo 6 giocatori"); return; }
            setupPlayerCount++; 
            const defaultToken = tokensLib[(setupPlayerCount - 1) % tokensLib.length].id;
            
            const div = document.createElement('div'); 
            div.className = "flex gap-2 items-center justify-between p-2 border-b border-gray-300 w-full flex-wrap";
            
            let tokensHTML = tokensLib.map(t => `
                <div class="token-option ${t.id === defaultToken ? 'selected' : ''}" data-pid="${setupPlayerCount}" data-tid="${t.id}" onclick="selectToken(${setupPlayerCount}, '${t.id}')">
                    ${tokenSVGs[t.id].replace('token-svg', 'token-svg-setup')}
                </div>
            `).join('');

            div.innerHTML = `
                <input type="text" id="pname-${setupPlayerCount}" value="Gioc. ${setupPlayerCount}" class="border border-gray-400 p-2 w-full sm:w-1/3 rounded font-bold font-['Montserrat'] outline-none focus:border-red-600">
                <div class="flex gap-1 justify-center sm:justify-end flex-1 flex-wrap" id="ptoken-container-${setupPlayerCount}">
                    ${tokensHTML}
                </div>
                <input type="hidden" id="ptoken-${setupPlayerCount}" value="${defaultToken}">
            `;
            document.getElementById('setup-players').appendChild(div);
        }

        function selectToken(playerId, tokenId) {
            document.getElementById(`ptoken-${playerId}`).value = tokenId;
            const container = document.getElementById(`ptoken-container-${playerId}`);
            container.querySelectorAll('.token-option').forEach(el => {
                if(el.getAttribute('data-tid') === tokenId) el.classList.add('selected');
                else el.classList.remove('selected');
            });
        }

        function startGame() {
            if(setupPlayerCount < 2) return showToast("Aggiungi almeno 2 giocatori");
            for(let i=1; i<=setupPlayerCount; i++) {
                gameState.players.push({
                    id: i, name: document.getElementById(`pname-${i}`).value, emoji: document.getElementById(`ptoken-${i}`).value, 
                    balance: 150000, pos: 0, inJail: false, jailTurns: 0
                });
            }
            document.getElementById('modal-setup').style.display = 'none';
            gameState.players.forEach(p => {
                const t = document.createElement('div'); t.id = `token-${p.id}`; t.className = 'token'; t.innerHTML = tokenSVGs[p.emoji];
                document.getElementById('board-area').appendChild(t);
            });
            updateTokens(); updateDashboard(); orientBoard(); document.getElementById('dice-area').classList.add('dice-ready');
            showToast("Che la partita abbia inizio!");
        }

        function orientBoard() {
            const rot = [0, 90, 180, -90, 0, 90][gameState.currentPlayerIdx] || 0;
            document.getElementById('center-board').style.transform = `rotate(${rot}deg)`;
            document.getElementById('action-wrapper').style.transform = `scale(1) rotate(${rot}deg)`;
        }

        function updateDashboard() {
            const dash = document.getElementById('dashboard'); dash.innerHTML = '';
            gameState.players.forEach((p, i) => {
                const active = i === gameState.currentPlayerIdx ? 'active' : '';
                dash.innerHTML += `
                    <div class="player-card ${active}">
                        <div class="player-name"><div class="dash-token">${tokenSVGs[p.emoji]}</div> ${p.name}</div>
                        <div class="player-balance">L. ${p.balance.toLocaleString('it-IT')}</div>
                        ${getDashboardNotesHTML(p.balance)}
                    </div>`;
            });
        }

        function updateTokens() {
            if (gameState.players.length === 0) return;
            const parentRect = document.getElementById('board-area').getBoundingClientRect();
            gameState.players.forEach(p => {
                const cell = document.getElementById(`cell-${p.pos}`); if(!cell) return;
                const rect = cell.getBoundingClientRect();
                const offsetX = (p.id % 2 === 0 ? -5 : 5); const offsetY = (p.id > 2 ? -5 : 5);
                const tEl = document.getElementById(`token-${p.id}`);
                tEl.style.left = `${(rect.left - parentRect.left) + rect.width/2 + offsetX}px`;
                tEl.style.top = `${(rect.top - parentRect.top) + rect.height/2 + offsetY}px`;
            });
        }
        let resizeTimeout; window.addEventListener('resize', () => { clearTimeout(resizeTimeout); resizeTimeout = setTimeout(updateTokens, 50); });

        function createStardust() {
            const diceArea = document.getElementById('dice-area'); const rect = diceArea.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2; const centerY = rect.top + rect.height / 2;
            for (let i = 0; i < 40; i++) {
                const star = document.createElement('div'); star.className = 'stardust';
                star.style.left = `${centerX}px`; star.style.top = `${centerY}px`;
                const angle = Math.random() * Math.PI * 2; const velocity = 5 + Math.random() * 20; 
                star.style.setProperty('--tx', `${Math.cos(angle) * velocity}vmin`); star.style.setProperty('--ty', `${Math.sin(angle) * velocity}vmin`);
                star.style.color = Math.random() > 0.5 ? '#ffd700' : '#ffffff'; star.style.background = star.style.color;
                const size = 0.3 + Math.random() * 0.5; star.style.width = `${size}vmin`; star.style.height = `${size}vmin`;
                document.body.appendChild(star); setTimeout(() => star.remove(), 1000);
            }
        }

        const diceRots = { 1: {x: 0, y: 0}, 2: {x: 0, y: 90}, 3: {x: -90, y: 0}, 4: {x: 90, y: 0}, 5: {x: 0, y: -90}, 6: {x: 180, y: 0} };
        function rollDice() {
            const diceArea = document.getElementById('dice-area');
            if(!diceArea.classList.contains('dice-ready') || gameState.isMoving) return;
            diceArea.classList.remove('dice-ready'); createStardust();
            
            const p = gameState.players[gameState.currentPlayerIdx];
            if(p.inJail) {
                p.jailTurns++;
                if(p.jailTurns > 3) { p.inJail = false; p.jailTurns = 0; payBankActive(5000); return; } 
                else { setTimeout(() => endTurn(), 1000); return; }
            }

            gameState.isMoving = true;
            const val1 = Math.floor(Math.random() * 6) + 1; const val2 = Math.floor(Math.random() * 6) + 1;
            gameState.lastRoll = val1 + val2;

            const d1El = document.getElementById('die1'); const d2El = document.getElementById('die2');
            const b1 = document.getElementById('bounce1'); const b2 = document.getElementById('bounce2');
            b1.classList.remove('anim-jump'); b2.classList.remove('anim-jump'); void b1.offsetWidth; void b2.offsetWidth;
            b1.classList.add('anim-jump'); b2.classList.add('anim-jump');

            const spin = () => Math.floor(Math.random() * 2 + 2) * 360;
            d1El.style.transform = `rotateX(${diceRots[val1].x + spin()}deg) rotateY(${diceRots[val1].y + spin()}deg)`;
            d2El.style.transform = `rotateX(${diceRots[val2].x + spin()}deg) rotateY(${diceRots[val2].y + spin()}deg)`;

            setTimeout(() => { stepMove(p, gameState.lastRoll); }, 1200);
        }

        function stepMove(player, stepsLeft) {
            if(stepsLeft === 0) { setTimeout(() => handleLanded(player), 3000); return; }
            player.pos++; if(player.pos >= 40) { player.pos = 0; receiveMoney(player, 20000); showToast("Passaggio dal VIA! Ritirate L. 20.000"); }
            updateTokens(); setTimeout(() => stepMove(player, stepsLeft - 1), 400); 
        }
        function movePlayerTo(player, targetPos) { player.pos = targetPos; updateTokens(); setTimeout(() => handleLanded(player), 1000); }
        function goToJail(player) { player.pos = 10; player.inJail = true; updateTokens(); endTurn(); }

        function handleLanded(player) {
            const cell = boardData[player.pos]; let html = '';
            if (cell.type === 'property' || cell.type === 'station' || cell.type === 'utility') {
                const propState = gameState.properties[cell.id];
                const headerColor = cell.color || '#333'; const fontCol = isLightColor(headerColor) ? '#111' : '#fff';
                html += `
                    <div class="card-property-original">
                        <div class="cpo-header" style="background-color: ${headerColor}; color: ${fontCol};">
                            <div class="cpo-subtitle">${cell.type === 'property' ? 'Titolo di Proprietà' : ''}</div>
                            <div class="cpo-title">${cell.name}</div>
                        </div>
                        <div class="cpo-body">
                            ${cell.type === 'property' ? `
                                <div class="cpo-row mb-2"><span>Rendita - Solo terreno</span> <span>L. ${cell.rent[0]}</span></div>
                                <div class="cpo-row"><span>Con 1 Casa</span> <span>L. ${cell.rent[1]}</span></div>
                                <div class="cpo-row"><span>Con 2 Case</span> <span>L. ${cell.rent[2]}</span></div>
                                <div class="cpo-row"><span>Con 3 Case</span> <span>L. ${cell.rent[3]}</span></div>
                                <div class="cpo-row"><span>Con 4 Case</span> <span>L. ${cell.rent[4]}</span></div>
                                <div class="cpo-row mt-2" style="font-size: 0.95rem;"><span>Con ALBERGO</span> <span>L. ${cell.rent[5]}</span></div>
                                <div class="cpo-divider"></div>
                                <div class="cpo-footer">Valore ipotecario L. ${cell.price / 2}<br>Costo Casa/Alb L. ${cell.houseCost}</div>
                            ` : `<div class="text-center font-bold text-lg mb-2">Valore L. ${cell.price}</div><div class="text-center italic">Rendita variabile.</div>`}
                        </div>
                    </div>`;

                if (!propState.ownerId) {
                    html += `
                        <div class="flex gap-2">
                            <button class="btn btn-buy btn-inline" onclick="buyProperty(${cell.id})">COMPRA (L. ${cell.price})</button>
                            <button class="btn btn-inline" onclick="endTurn()">PASSA</button>
                        </div>`;
                } else if (propState.ownerId !== player.id) {
                    const owner = gameState.players.find(p => p.id === propState.ownerId); const rent = calculateRent(cell, propState);
                    html += `
                        <p class="mb-3 text-red-600 font-bold text-lg">Proprietà di ${owner.name}</p>
                        <button class="btn btn-pay" onclick="payRent(${cell.id}, ${rent})">PAGA AFFITTO L. ${rent}</button>`;
                } else if (cell.type === 'property' && propState.level < 5) {
                    html += `
                        <p class="mb-3 text-green-600 font-bold">Tua Proprietà</p>
                        <div class="flex gap-2">
                            <button class="btn btn-buy btn-inline" onclick="buildHouse(${cell.id})">COSTRUISCI (L. ${cell.houseCost})</button>
                            <button class="btn btn-inline" onclick="endTurn()">FINE</button>
                        </div>`;
                } else { html += `<button class="btn" onclick="endTurn()">FINE TURNO</button>`; }
            } else if (cell.type === 'chance' || cell.type === 'chest') {
                const isProb = cell.type === 'chance'; const deck = isProb ? probDeck : imprDeck;
                const card = deck[Math.floor(Math.random() * deck.length)];
                html += `
                    <div class="card-event ${isProb ? 'probabilita' : 'imprevisti'}">
                        <div class="card-event-title">${isProb ? "PROBABILITÀ" : "IMPREVISTI"}</div>
                        <div class="card-event-text">"${card.txt}"</div>
                    </div>
                    <button class="btn" onclick="resolveCard(${deck.indexOf(card)}, '${cell.type}')">OK</button>`;
            } else if (cell.type === 'tax') {
                html += `
                    <h2 class="text-xl font-bold mb-3 text-red-600 font-['Montserrat']">${cell.name}</h2>
                    <p class="mb-4 text-lg font-bold">${cell.desc}</p>
                    <button class="btn btn-pay" onclick="payBankActive(${cell.cost})">PAGA L. ${cell.cost}</button>`;
            } else if (cell.id === 30) {
                html += `
                    <h2 class="text-xl font-bold mb-3 text-red-600 font-['Montserrat']">IN PRIGIONE!</h2>
                    <button class="btn" onclick="goToJailActive()">VAI IN PRIGIONE</button>`;
            } else {
                html += `<h2 class="text-xl font-bold mb-3 font-['Montserrat']">${cell.name}</h2><button class="btn" onclick="endTurn()">CONTINUA</button>`;
            }
            openModal(html);
        }

        function calculateRent(cell, propState) {
            if (cell.type === 'property') return cell.rent[propState.level];
            if (cell.type === 'station') return 2500 * Math.pow(2, [5,15,25,35].filter(id => gameState.properties[id].ownerId === propState.ownerId).length - 1);
            if (cell.type === 'utility') return gameState.lastRoll * ([12,28].filter(id => gameState.properties[id].ownerId === propState.ownerId).length === 2 ? 1000 : 400);
            return 0;
        }

        function buyProperty(cellId) {
            const p = gameState.players[gameState.currentPlayerIdx]; const cell = boardData.find(c => c.id === cellId);
            openPayment(cell.price, `Acquisto ${cell.name}`, () => {
                p.balance -= cell.price; gameState.properties[cellId].ownerId = p.id;
                document.getElementById(`cell-${cellId}`).style.borderBottom = `clamp(3px, 0.6vmin, 6px) solid ${cell.color || '#333'}`;
                updateDashboard(); endTurn();
            });
        }
        function payRent(cellId, amount) {
            const p = gameState.players[gameState.currentPlayerIdx]; const ownerId = gameState.properties[cellId].ownerId;
            openPayment(amount, "Pagamento Affitto", () => {
                p.balance -= amount; gameState.players.find(x => x.id === ownerId).balance += amount;
                updateDashboard(); endTurn();
            });
        }
        function buildHouse(cellId) {
            const p = gameState.players[gameState.currentPlayerIdx]; const cell = boardData.find(c => c.id === cellId);
            openPayment(cell.houseCost, "Costruzione Edificio", () => {
                p.balance -= cell.houseCost; const propState = gameState.properties[cellId]; propState.level++;
                const cb = document.getElementById(`cb-${cellId}`); cb.innerHTML = '';
                if(propState.level === 5) cb.innerHTML = `<div class="hotel"></div>`;
                else for(let i=0; i<propState.level; i++) cb.innerHTML += `<div class="house"></div>`;
                updateDashboard(); endTurn();
            });
        }
        function resolveCard(cardIdx, type) {
            const card = (type === 'chance' ? probDeck : imprDeck)[cardIdx]; closeModal(); card.action(gameState.players[gameState.currentPlayerIdx]);
            if(!card.action.toString().includes('movePlayerTo') && !card.action.toString().includes('payBankActive')) endTurn();
        }
        function payBankActive(amount) { 
            openPayment(amount, "Pagamento Tassa/Banca", () => { gameState.players[gameState.currentPlayerIdx].balance -= amount; updateDashboard(); endTurn(); });
        }
        function receiveMoney(player, amount) { player.balance += amount; updateDashboard(); }
        function goToJailActive() { closeModal(); goToJail(gameState.players[gameState.currentPlayerIdx]); }

        function endTurn() {
            closeModal(); gameState.isMoving = false;
            if(gameState.players[gameState.currentPlayerIdx].balance < 0) showToast(`BANCAROTTA PER ${gameState.players[gameState.currentPlayerIdx].name}!`);
            gameState.currentPlayerIdx = (gameState.currentPlayerIdx + 1) % gameState.players.length;
            orientBoard(); updateDashboard(); setTimeout(() => { document.getElementById('dice-area').classList.add('dice-ready'); }, 800);
        }

        function openModal(contentHtml) { document.getElementById('action-content').innerHTML = contentHtml; document.getElementById('modal-action').style.display = 'flex'; }
        function closeModal() { document.getElementById('modal-action').style.display = 'none'; }

        window.onload = () => { initBoard(); addSetupPlayer(); addSetupPlayer(); };
    </script>
</body>
</html>
