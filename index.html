        function showPlayerProperties(playerIdx) {
            if(playerIdx >= gameState.players.length || gameState.isMoving) return;
            const player = gameState.players[playerIdx];
            const myPropsIds = Object.keys(gameState.properties).filter(id => gameState.properties[id].ownerId === player.id);
            const isCurrent = player.id === gameState.players[gameState.currentPlayerIdx].id;
            
            let html = `<h2 class="text-xl font-bold mb-4 font-['Montserrat'] uppercase text-red-600">${player.name} - ${t('my_props')}</h2>`;
            
            if(myPropsIds.length === 0) {
                html += `<p class="text-gray-500 mb-4">${t('empty')}</p>`;
            } else {
                html += `<div class="flex flex-wrap justify-center gap-4 overflow-y-auto pr-2 pb-2" style="max-height: 60vh;">`;
                myPropsIds.forEach(idStr => {
                    const id = parseInt(idStr);
                    const cell = getBoardData().find(c => c.id === id);
                    const propState = gameState.properties[id];
                    
                    html += `<div>`;
                    html += generateCardHTML(cell, propState);
                    
                    if (isCurrent) {
                        html += `<div class="flex flex-col gap-1.5 mt-2 mb-2 w-[220px]">`;
                        if (cell.type === 'property') {
                            if (propState.level < 5 && hasMonopoly(player.id, cell.color) && !propState.mortgaged) {
                                html += `<button class="btn btn-buy w-full py-2 text-xs" onclick="buildHouse(${id})">${t('build_btn')} L. ${cell.houseCost.toLocaleString('it-IT')}</button>`;
                            } else if (!hasMonopoly(player.id, cell.color)) {
                                html += `<p class="text-[10px] text-red-500 text-center italic">${t('build_not_allowed')}</p>`;
                            }
                            
                            if (propState.level > 0) {
                                html += `<button class="btn btn-pay w-full py-1.5 text-xs" onclick="sellBuildingToBank(${id})">${t('sell_building_btn')} L. ${(cell.houseCost / 2).toLocaleString('it-IT')}</button>`;
                            }
                        }

                        if (!propState.mortgaged) {
                            if (canMortgageColorGroup(player.id, cell.color)) {
                                html += `<button class="btn bg-orange-500 hover:bg-orange-600 text-white w-full py-1 text-xs font-bold" onclick="mortgageProperty(${id})">${t('mortgage_btn')} L. ${(cell.price / 2).toLocaleString('it-IT')}</button>`;
                            } else {
                                html += `<p class="text-[9px] text-red-500 text-center italic">${t('msg_sell_uniform')}</p>`;
                            }
                        } else {
                            html += `<button class="btn bg-green-600 hover:bg-green-700 text-white w-full py-1 text-xs font-bold" onclick="unmortgageProperty(${id})">${t('unmortgage_btn')} L. ${((cell.price / 2) * 1.1).toLocaleString('it-IT')}</button>`;
                        }
                        html += `</div>`;
                    }
                    html += `</div>`;
                });
                html += `</div>`;
            }
            
            html += `<button class="btn mt-4" onclick="closeModal()">${t('close')}</button>`;
            openModal(html);
        }

        function canMortgageColorGroup(ownerId, colorCode) {
            if (!colorCode) return true; 
            const colorGroup = getBoardData().filter(c => c.color === colorCode);
            return colorGroup.every(c => gameState.properties[c.id] && gameState.properties[c.id].level === 0);
        }

        function mortgageProperty(id) {
            closeModal();
            const p = gameState.players[gameState.currentPlayerIdx];
            const cell = getBoardData().find(c => c.id === id);
            const value = cell.price / 2;
            
            gameState.properties[id].mortgaged = true;
            p.balance += value;
            updateDashboard();
            refreshBoardVisuals();
            showToast(tf('msg_mortgaged', cell.name.replace(/<br>/g, ' '), value.toLocaleString('it-IT')));
        }

        function unmortgageProperty(id) {
            closeModal();
            const p = gameState.players[gameState.currentPlayerIdx];
            const cell = getBoardData().find(c => c.id === id);
            const cost = (cell.price / 2) * 1.1; 
            
            if (p.balance < cost) {
                showToast(t('msg_insufficient_unmortgage'));
                return;
            }

            openPayment(cost, t('unmortgage_btn') + " - " + cell.name.replace(/<br>/g, ' '), () => {
                p.balance -= cost;
                gameState.properties[id].mortgaged = false;
                updateDashboard();
                refreshBoardVisuals();
                showToast(tf('msg_unmortgaged', cell.name.replace(/<br>/g, ' ')));
            }, false);
        }

        function sellBuildingToBank(id) {
            closeModal();
            const p = gameState.players[gameState.currentPlayerIdx];
            const cell = getBoardData().find(c => c.id === id);
            const colorGroup = getBoardData().filter(c => c.color === cell.color);
            const propState = gameState.properties[id];
            
            const maxLevelInGroup = Math.max(...colorGroup.map(c => gameState.properties[c.id].level));
            if (propState.level < maxLevelInGroup) {
                showToast(t('msg_sell_uniform'));
                return;
            }

            const value = cell.houseCost / 2;
            p.balance += value;
            propState.level--;
            updateDashboard();
            refreshBoardVisuals();
            showToast(tf('msg_sold_house', value.toLocaleString('it-IT')));
        }

        function handleLanded(player) {
            const bd = getBoardData(); const cell = bd[player.pos]; let html = ''; let isCard = false; let cardColor = '';
            
            if (cell.type === 'property' || cell.type === 'station' || cell.type === 'utility') {
                const propState = gameState.properties[cell.id];
                
                html += `<div class="flex justify-center mb-4">` + generateCardHTML(cell, propState) + `</div>`;

                if (!propState.ownerId) {
                    html += `<div class="flex gap-2 w-full mt-2">
                                <button class="btn btn-buy btn-inline" onclick="buyProperty(${cell.id})">${t('buy_btn')} L. ${cell.price.toLocaleString('it-IT')}</button>
                                <button class="btn btn-inline" onclick="endTurn()">${t('pass_btn')}</button>
                             </div>`;
                } else if (propState.ownerId !== player.id) {
                    const owner = gameState.players.find(p => p.id === propState.ownerId); 
                    const rent = calculateRent(cell, propState);
                    
                    if (propState.mortgaged) {
                        html += `<p class="mb-2 text-orange-600 font-bold text-lg">🏚️ ${t('mortgaged_label')} (${owner.name})</p>
                                 <button class="btn" onclick="endTurn()">${t('ok_btn')}</button>`;
                    } else {
                        html += `<p class="mb-2 text-red-600 font-bold text-lg">${t('prop_of')} ${owner.name}</p>
                                 <button class="btn btn-pay" onclick="payRent(${cell.id}, ${rent})">${t('pay_btn')} L. ${rent.toLocaleString('it-IT')}</button>`;
                    }
                } else { 
                    html += `<p class="mb-2 text-green-600 font-bold">${t('your_prop')}</p><button class="btn" onclick="endTurn()">${t('end_turn')}</button>`; 
                }
            } else if (cell.type === 'chance' || cell.type === 'chest') {
                isCard = true;
                const isProb = cell.type === 'chance'; 
                cardColor = isProb ? 'var(--prob-color)' : 'var(--impr-color)';
                const events = i18n[currentLang].events;
                const evIndex = Math.floor(Math.random() * events.length);
                const eventTxt = events[evIndex];
                
                html += `
                    <div class="flex flex-col items-center justify-center h-full text-[#111] px-4 py-6" style="flex: 1; min-height: 180px;">
                        <div class="font-black text-xl md:text-2xl mb-4 font-['Montserrat'] uppercase tracking-widest text-center opacity-80 border-b-2 border-[#111] pb-2 w-full">${isProb ? t('chance_title') : t('chest_title')}</div>
                        <div class="text-base md:text-lg font-medium font-['Helvetica_Neue',sans-serif] text-center leading-relaxed w-full">"${eventTxt}"</div>
                    </div>
                    <div class="flex justify-center p-3 w-full bg-black bg-opacity-5">
                        <button class="btn bg-white bg-opacity-40 border-[#111] text-[#111] shadow-none hover:bg-opacity-60 w-full max-w-[200px]" onclick="resolveCard(${evIndex})">${t('ok_btn')}</button>
                    </div>`;
            } else if (cell.type === 'tax') {
                html += `<h2 class="text-lg md:text-xl font-bold mb-2 text-red-600 font-['Montserrat']">${cell.name.replace(/<br>/g, ' ')}</h2>
                         <button class="btn btn-pay" onclick="payBankActive(${cell.cost})">${t('pay_btn')} L. ${cell.cost.toLocaleString('it-IT')}</button>`;
            } else if (cell.id === 30) {
                html += `<h2 class="text-lg md:text-xl font-bold mb-2 text-red-600 font-['Montserrat']">${t('go_jail_btn')}</h2>
                         <button class="btn btn-pay" onclick="goToJail()">${t('ok_btn')}</button>`;
            } else {
                html += `<h2 class="text-lg md:text-xl font-bold mb-2 font-['Montserrat']">${cell.name.replace(/<br>/g, ' ')}</h2><button class="btn" onclick="endTurn()">${t('ok_btn')}</button>`;
            }
            openModal(html, isCard, cardColor);
        }

        function calculateRent(cell, propState) {
            if (propState.mortgaged) return 0; 
            if (cell.type === 'property') return cell.rent[propState.level];
            if (cell.type === 'station') return 2500 * Math.pow(2, [5,15,25,35].filter(id => gameState.properties[id].ownerId === propState.ownerId && !gameState.properties[id].mortgaged).length - 1);
            if (cell.type === 'utility') return gameState.lastRoll * ([12,28].filter(id => gameState.properties[id].ownerId === propState.ownerId && !gameState.properties[id].mortgaged).length === 2 ? 1000 : 400);
            return 0;
        }

        function buyProperty(cellId) {
            const p = gameState.players[gameState.currentPlayerIdx]; const cell = getBoardData().find(c => c.id === cellId);
            openPayment(cell.price, `${t('buy_title')} - ${cell.name.replace(/<br>/g, ' ')}`, () => {
                p.balance -= cell.price; gameState.properties[cellId].ownerId = p.id;
                updateDashboard(); refreshBoardVisuals(); endTurn();
            }, false);
        }
        function payRent(cellId, amount) {
            const p = gameState.players[gameState.currentPlayerIdx]; const ownerId = gameState.properties[cellId].ownerId;
            const cell = getBoardData().find(c => c.id === cellId);
            openPayment(amount, `${t('rent_title')} - ${cell.name.replace(/<br>/g, ' ')}`, () => {
                p.balance -= amount; gameState.players.find(x => x.id === ownerId).balance += amount; 
                updateDashboard(); endTurn();
            }, true);
        }
        function buildHouse(cellId) {
            const p = gameState.players[gameState.currentPlayerIdx]; const cell = getBoardData().find(c => c.id === cellId);
            const colorGroup = getBoardData().filter(c => c.color === cell.color);
            const currentLevel = gameState.properties[cellId].level;

            const minLevelInGroup = Math.min(...colorGroup.map(c => gameState.properties[c.id].level));
            if (currentLevel > minLevelInGroup) {
                showToast(t('msg_build_uniform'));
                return;
            }

            openPayment(cell.houseCost, `${t('build_title')} - ${cell.name.replace(/<br>/g, ' ')}`, () => {
                p.balance -= cell.houseCost; gameState.properties[cellId].level++; 
                updateDashboard(); refreshBoardVisuals(); closeModal();
            }, false);
        }
        
        function renderBuildings(cellId) {
            const bld = document.getElementById(`bld-${cellId}`); if(!bld) return;
            const lvl = gameState.properties[cellId]?.level || 0; bld.innerHTML = '';
            if(lvl === 5) bld.innerHTML = `<div class="hotel"></div>`;
            else for(let i=0; i<lvl; i++) bld.innerHTML += `<div class="house"></div>`;
        }
        
        function resolveCard(evIndex) {
            closeModal(); const p = gameState.players[gameState.currentPlayerIdx];
            switch(evIndex) {
                case 0: goToJail(); break;
                case 1: advanceTo(p, 39); break;
                case 2: advanceTo(p, 1); break;
                case 3: receiveMoney(p, 10000); endTurn(); break;
                case 4: receiveMoney(p, 15000); endTurn(); break;
                case 5: payBankActive(1500); break;
                case 6: 
                    p.jailCards++;
                    updateDashboard();
                    showToast(t('events')[6]);
                    endTurn();
                    break;
                default: endTurn();
            }
        }
        
        function advanceTo(p, targetPos) {
            if (targetPos < p.pos && targetPos !== 10) { p.balance += 20000; showToast(t('go_msg')); updateDashboard(); }
            p.pos = targetPos; updateTokens(); setTimeout(() => handleLanded(p), 600);
        }

        function payBankActive(amount) { openPayment(amount, t('tax_title'), () => { gameState.players[gameState.currentPlayerIdx].balance -= amount; updateDashboard(); endTurn(); }, true); }
        function receiveMoney(player, amount) { player.balance += amount; updateDashboard(); }
        function goToJail() { closeModal(); const p = gameState.players[gameState.currentPlayerIdx]; p.pos = 10; p.inJail = true; updateTokens(); endTurn(); }

        let currentTradeProposal = null;

        function openTradingPanel() {
            if (gameState.isMoving) return;
            
            const currentP = gameState.players[gameState.currentPlayerIdx];
            document.getElementById('trade-self-name').innerText = `${currentP.name.toUpperCase()} (${t('you_offer')})`;
            
            const partnerSelect = document.getElementById('trade-partner-select');
            partnerSelect.innerHTML = '';
            
            const opponents = gameState.players.filter(p => p.id !== currentP.id && p.balance >= 0);
            if (opponents.length === 0) {
                showToast(t('msg_no_trade_partner'));
                return;
            }

            opponents.forEach(p => {
                partnerSelect.innerHTML += `<option value="${p.id}">${p.name}</option>`;
            });

            document.getElementById('trade-self-maxcash').innerText = currentP.balance.toLocaleString('it-IT');
            document.getElementById('trade-self-cash').max = currentP.balance;
            document.getElementById('trade-self-cash').value = 0;
            
            const jailCardAreaSelf = document.getElementById('trade-self-jailcard-area');
            if (currentP.jailCards > 0) {
                jailCardAreaSelf.style.display = 'flex';
                document.getElementById('trade-self-jailcard').checked = false;
            } else {
                jailCardAreaSelf.style.display = 'none';
            }

            onTradePartnerChanged();
            document.getElementById('modal-trade').style.display = 'flex';
        }

        function closeTradingPanel() {
            document.getElementById('modal-trade').style.display = 'none';
        }

        function onTradePartnerChanged() {
            const currentP = gameState.players[gameState.currentPlayerIdx];
            const select = document.getElementById('trade-partner-select');
            if (!select.value) return;
            
            const partnerId = parseInt(select.value);
            const partnerP = gameState.players.find(p => p.id === partnerId);
            
            document.getElementById('trade-partner-name').innerText = `${partnerP.name.toUpperCase()} (${t('you_demand')})`;
            document.getElementById('trade-partner-maxcash').innerText = partnerP.balance.toLocaleString('it-IT');
            document.getElementById('trade-partner-cash').max = partnerP.balance;
            document.getElementById('trade-partner-cash').value = 0;

            const jailCardAreaPartner = document.getElementById('trade-partner-jailcard-area');
            if (partnerP.jailCards > 0) {
                jailCardAreaPartner.style.display = 'flex';
                document.getElementById('trade-partner-jailcard').checked = false;
            } else {
                jailCardAreaPartner.style.display = 'none';
            }

            populateTradePropertyList(currentP.id, 'trade-self-props');
            populateTradePropertyList(partnerP.id, 'trade-partner-props');
        }

        function populateTradePropertyList(playerId, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            const pProps = Object.keys(gameState.properties).filter(id => gameState.properties[id].ownerId === playerId);
            if (pProps.length === 0) {
                container.innerHTML = `<span class="text-xs text-gray-400 italic">${t('none_prop')}</span>`;
                return;
            }

            pProps.forEach(idStr => {
                const id = parseInt(idStr);
                const cell = getBoardData().find(c => c.id === id);
                const propState = gameState.properties[id];
                
                const isGroupClean = canMortgageColorGroup(playerId, cell.color);
                
                let disabledAttr = '';
                let titleLabel = '';
                if (!isGroupClean) {
                    disabledAttr = 'disabled';
                    titleLabel = `title="${t('no_buildings_trade')}"`;
                }

                let isMortgagedBadge = propState.mortgaged ? ` <span class="text-[9px] bg-red-100 text-red-600 rounded px-1 ml-1 font-bold">IPOTECA</span>` : '';

                container.innerHTML += `
                    <div class="flex items-center gap-1.5 p-1 hover:bg-gray-50 rounded ${!isGroupClean ? 'opacity-50' : ''}" ${titleLabel}>
                        <input type="checkbox" id="trade-prop-${id}" value="${id}" ${disabledAttr} class="rounded text-red-600">
                        <label for="trade-prop-${id}" class="text-xs font-bold text-gray-700 truncate cursor-pointer flex-1">
                            <span class="inline-block w-2.5 h-2.5 rounded-sm mr-1" style="background-color: ${cell.color || '#888'};"></span>
                            ${cell.name.replace(/<br>/g, ' ')} ${isMortgagedBadge}
                        </label>
                    </div>
                `;
            });
        }

        function validateTradeOfferCash() {
            const input = document.getElementById('trade-self-cash');
            const currentP = gameState.players[gameState.currentPlayerIdx];
            if (input.value > currentP.balance) input.value = currentP.balance;
            if (input.value < 0) input.value = 0;
        }

        function validateTradePartnerCash() {
            const input = document.getElementById('trade-partner-cash');
            const partnerId = parseInt(document.getElementById('trade-partner-select').value);
            const partnerP = gameState.players.find(p => p.id === partnerId);
            if (input.value > partnerP.balance) input.value = partnerP.balance;
            if (input.value < 0) input.value = 0;
        }

        function submitTradeOffer() {
            const currentP = gameState.players[gameState.currentPlayerIdx];
            const partnerId = parseInt(document.getElementById('trade-partner-select').value);
            const partnerP = gameState.players.find(p => p.id === partnerId);

            const selfPropsChecked = [];
            const selfPropsContainer = document.getElementById('trade-self-props');
            selfPropsContainer.querySelectorAll('input[type="checkbox"]:checked').forEach(cb => {
                selfPropsChecked.push(parseInt(cb.value));
            });

            const partnerPropsChecked = [];
            const partnerPropsContainer = document.getElementById('trade-partner-props');
            partnerPropsContainer.querySelectorAll('input[type="checkbox"]:checked').forEach(cb => {
                partnerPropsChecked.push(parseInt(cb.value));
            });

            const selfCash = parseInt(document.getElementById('trade-self-cash').value) || 0;
            const partnerCash = parseInt(document.getElementById('trade-partner-cash').value) || 0;
            const selfJailCard = document.getElementById('trade-self-jailcard')?.checked || false;
            const partnerJailCard = document.getElementById('trade-partner-jailcard')?.checked || false;

            if (selfPropsChecked.length === 0 && partnerPropsChecked.length === 0 && selfCash === 0 && partnerCash === 0 && !selfJailCard && !partnerJailCard) {
                showToast(t('msg_trade_empty'));
                return;
            }

            currentTradeProposal = {
                senderId: currentP.id,
                receiverId: partnerP.id,
                senderProps: selfPropsChecked,
                receiverProps: partnerPropsChecked,
                senderCash: selfCash,
                receiverCash: partnerCash,
                senderJailCard: selfJailCard,
                receiverJailCard: partnerJailCard
            };

            closeTradingPanel();
            showTradeProposalToReceiver();
        }

        function showTradeProposalToReceiver() {
            const sender = gameState.players.find(p => p.id === currentTradeProposal.senderId);
            const receiver = gameState.players.find(p => p.id === currentTradeProposal.receiverId);

            let html = `
                <h2 class="text-xl font-bold mb-2 text-red-600 font-['Montserrat'] uppercase tracking-wide">${t('trade_title')}</h2>
                <p class="mb-4 text-sm font-medium text-gray-700"><b>${sender.name}</b> ${t('trade_received_from')}</p>
                
                <div class="grid grid-cols-2 gap-3 mb-5">
                    <div class="bg-green-50 border border-green-200 p-3 rounded-lg text-left">
                        <h4 class="font-bold text-xs uppercase text-green-700 border-b pb-1 mb-2">${t('trade_gives')}</h4>
                        <div class="space-y-1 text-xs font-semibold text-gray-700">`;
            
            if (currentTradeProposal.senderCash > 0) {
                html += `<div>💵 Cash: <span class="text-green-600 font-black">L. ${currentTradeProposal.senderCash.toLocaleString()}</span></div>`;
            }
            if (currentTradeProposal.senderJailCard) {
                html += `<div>✉️ 1x ${t('jail_card_label')}</div>`;
            }
            if (currentTradeProposal.senderProps.length > 0) {
                currentTradeProposal.senderProps.forEach(id => {
                    const cell = getBoardData().find(c => c.id === id);
                    html += `<div class="flex items-center gap-1.5">
                        <span class="inline-block w-2 h-2 rounded-full" style="background-color: ${cell.color || '#999'};"></span>
                        ${cell.name.replace(/<br>/g, ' ')}
                    </div>`;
                });
            }
            if (currentTradeProposal.senderCash === 0 && !currentTradeProposal.senderJailCard && currentTradeProposal.senderProps.length === 0) {
                html += `<div class="italic text-gray-400">Nulla</div>`;
            }

            html += `   </div>
                    </div>

                    <div class="bg-red-50 border border-red-200 p-3 rounded-lg text-left">
                        <h4 class="font-bold text-xs uppercase text-red-700 border-b pb-1 mb-2">${t('trade_asks')}</h4>
                        <div class="space-y-1 text-xs font-semibold text-gray-700">`;
            
            if (currentTradeProposal.receiverCash > 0) {
                html += `<div>💵 Cash: <span class="text-red-600 font-black">L. ${currentTradeProposal.receiverCash.toLocaleString()}</span></div>`;
            }
            if (currentTradeProposal.receiverJailCard) {
                html += `<div>✉️ 1x ${t('jail_card_label')}</div>`;
            }
            if (currentTradeProposal.receiverProps.length > 0) {
                currentTradeProposal.receiverProps.forEach(id => {
                    const cell = getBoardData().find(c => c.id === id);
                    html += `<div class="flex items-center gap-1.5">
                        <span class="inline-block w-2 h-2 rounded-full" style="background-color: ${cell.color || '#999'};"></span>
                        ${cell.name.replace(/<br>/g, ' ')}
                    </div>`;
                });
            }
            if (currentTradeProposal.receiverCash === 0 && !currentTradeProposal.receiverJailCard && currentTradeProposal.receiverProps.length === 0) {
                html += `<div class="italic text-gray-400">Nulla</div>`;
            }

            html += `   </div>
                    </div>
                </div>

                <div class="flex gap-2 w-full">
                    <button class="btn btn-pay btn-inline" onclick="rejectTradeOffer()">${t('reject')}</button>
                    <button class="btn btn-buy btn-inline" onclick="acceptTradeOffer()">${t('accept')}</button>
                </div>
            `;
            
            openModal(html);
        }

        function rejectTradeOffer() {
            closeModal();
            showToast(t('msg_trade_rejected'));
            currentTradeProposal = null;
        }

        function acceptTradeOffer() {
            closeModal();
            if (!currentTradeProposal) return;

            const sender = gameState.players.find(p => p.id === currentTradeProposal.senderId);
            const receiver = gameState.players.find(p => p.id === currentTradeProposal.receiverId);

            if (sender.balance < currentTradeProposal.senderCash || receiver.balance < currentTradeProposal.receiverCash) {
                showToast("⚠️ " + t('not_enough_cash_trade'));
                currentTradeProposal = null;
                return;
            }

            sender.balance -= currentTradeProposal.senderCash;
            sender.balance += currentTradeProposal.receiverCash;

            receiver.balance -= currentTradeProposal.receiverCash;
            receiver.balance += currentTradeProposal.senderCash;

            if (currentTradeProposal.senderJailCard) {
                sender.jailCards--;
                receiver.jailCards++;
            }
            if (currentTradeProposal.receiverJailCard) {
                receiver.jailCards--;
                sender.jailCards++;
            }

            currentTradeProposal.senderProps.forEach(id => {
                gameState.properties[id].ownerId = receiver.id;
                
                if (gameState.properties[id].mortgaged) {
                    const cell = getBoardData().find(c => c.id === id);
                    const taxCost = Math.round((cell.price / 2) * 0.1);
                    receiver.balance -= taxCost;
                    showToast(tf('msg_mortgage_transfer_tax', receiver.name, taxCost.toLocaleString('it-IT')));
                }
            });

            currentTradeProposal.receiverProps.forEach(id => {
                gameState.properties[id].ownerId = sender.id;
                
                if (gameState.properties[id].mortgaged) {
                    const cell = getBoardData().find(c => c.id === id);
                    const taxCost = Math.round((cell.price / 2) * 0.1);
                    sender.balance -= taxCost;
                    showToast(tf('msg_mortgage_transfer_tax', sender.name, taxCost.toLocaleString('it-IT')));
                }
            });

            currentTradeProposal = null;
            updateDashboard();
            refreshBoardVisuals();
            showToast("🤝 " + t('trade_success'));
        }

        let currentPayment = { amount: 0, callback: null, traySum: 0, wallet: [], tray: [], isMandatory: false };

        function openPayment(amount, reason, callback, isMandatory = false) {
            const p = gameState.players[gameState.currentPlayerIdx];
            if (p.balance < amount) { 
                showToast(`⚠️ ${t('bankrupt_msg')} ${p.name}!`); 
                p.balance = -1; 
                endTurn(); 
                return; 
            }
            closeModal();
            currentPayment = { amount: amount, callback: callback, traySum: 0, wallet: getNotesArray(p.balance), tray: [], isMandatory: isMandatory };
            document.getElementById('pay-title').innerText = reason; 
            renderPaymentUI();
            document.getElementById('modal-payment').style.display = 'flex';
        }

        function renderPaymentUI() {
            document.getElementById('pay-desc').innerHTML = `${t('pay_req')} <b>L. ${currentPayment.amount.toLocaleString('it-IT')}</b>`;
            const renderNotes = (arr, onclickStr) => {
                if(arr.length === 0) return `<span class="text-gray-400 text-sm w-full text-center">${t('empty')}</span>`;
                return arr.map((val, i) => generateNoteSVG(val, noteColors[val]).replace('<div ', `<div onclick="${onclickStr}(${i})" style="z-index: ${i};" `)).join('');
            };
            document.getElementById('pay-tray').innerHTML = renderNotes(currentPayment.tray, 'moveNoteToWallet');
            document.getElementById('pay-wallet').innerHTML = renderNotes(currentPayment.wallet, 'moveNoteToTray');

            const sumEl = document.getElementById('tray-sum'); sumEl.innerText = `L. ${currentPayment.traySum.toLocaleString('it-IT')}`;
            const btnConfirm = document.getElementById('btn-confirm-pay'); const btnCancel = document.getElementById('btn-cancel-pay');
            
            if (currentPayment.traySum >= currentPayment.amount) {
                sumEl.className = "float-right text-green-600 font-bold text-lg"; btnConfirm.disabled = false;
                const change = currentPayment.traySum - currentPayment.amount;
                btnConfirm.innerText = change > 0 ? `${t('pay_recv')} (L. ${change.toLocaleString('it-IT')})` : t('confirm_pay');
            } else {
                sumEl.className = "float-right text-red-600 font-bold text-lg"; btnConfirm.disabled = true; btnConfirm.innerText = t('confirm_pay');
            }
            btnCancel.style.display = currentPayment.isMandatory ? 'none' : 'inline-flex';
        }

        function moveNoteToTray(index) { const val = currentPayment.wallet.splice(index, 1)[0]; currentPayment.tray.push(val); currentPayment.traySum += val; renderPaymentUI(); }
        function moveNoteToWallet(index) { const val = currentPayment.tray.splice(index, 1)[0]; currentPayment.wallet.push(val); currentPayment.traySum -= val; renderPaymentUI(); }
        function confirmPayment() { if (currentPayment.traySum >= currentPayment.amount) { document.getElementById('modal-payment').style.display = 'none'; currentPayment.callback(); } }
        function cancelPayment() { document.getElementById('modal-payment').style.display = 'none'; endTurn(); }

        function openModal(html, isCard = false, bgColor = '') { 
            const content = document.getElementById('action-content'); content.innerHTML = html;
            if (isCard) { content.className = 'modal-box solid-card'; content.style.backgroundColor = bgColor; } 
            else { content.className = 'modal-box'; content.style.backgroundColor = '#fdfbf7'; }
            document.getElementById('modal-action').style.display = 'flex'; 
        }
        function closeModal() { document.getElementById('modal-action').style.display = 'none'; }

        function endTurn() {
            closeModal(); gameState.isMoving = false;
            const currP = gameState.players[gameState.currentPlayerIdx];
            if(currP.balance < 0) {
                Object.keys(gameState.properties).forEach(k => {
                    if(gameState.properties[k].ownerId === currP.id) {
                        gameState.properties[k].ownerId = null; 
                        gameState.properties[k].level = 0;
                        gameState.properties[k].mortgaged = false;
                        const cellEl = document.getElementById(`cell-${k}`); if(cellEl) cellEl.style.border = '';
                        renderBuildings(k);
                    }
                });
                const tokenEl = document.getElementById(`token-${currP.id}`); if(tokenEl) tokenEl.style.display = 'none';
                const pzEl = document.getElementById(`pz-${gameState.currentPlayerIdx}`); if(pzEl) pzEl.classList.add('bankrupt');
            }

            let nextIdx = (gameState.currentPlayerIdx + 1) % gameState.players.length; let loops = 0;
            while(gameState.players[nextIdx].balance < 0 && loops < gameState.players.length) { nextIdx = (nextIdx + 1) % gameState.players.length; loops++; }
            
            if (loops >= gameState.players.length - 1) {
                showToast(tf('msg_winner', gameState.players[nextIdx].name.toUpperCase()));
                updateDashboard(); return;
            }
            gameState.currentPlayerIdx = nextIdx; updateDashboard(); 
            setTimeout(() => document.getElementById('dice-area').classList.add('dice-ready'), 500);
        }

        window.onload = () => { 
            const detectedLang = detectBrowserLanguage();
            setLang(detectedLang); 
            addSetupPlayer(); addSetupPlayer(); 
        };
    </script>
</body>
</html>
