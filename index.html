<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Monopoly - Multi-language Tabletop Edition">
    <title>Monopoly Tabletop</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Colori Tabellone Classico */
            --bg-board: #acc4b1;
            --border-color: #1a1a1a;
            --cell-bg: #e8ecd3;
            
            /* Colori Proprietà */
            --brown: #8e5033; --lightblue: #8ed6ef; --pink: #db2b6c;
            --orange: #f5821c; --red: #e62c26; --yellow: #ffec19;
            --green: #41ab5d; --darkblue: #1b73b8;
            
            /* Colori Carte */
            --prob-color: #d1dac5;
            --impr-color: #f79854;
            
            /* Banconote */
            --c100: #65a5d1; --c1000: #7aba83; --c10000: #d8c4a9; --c50000: #e4808a;

            /* Texture realistiche leggerissime via SVG */
            --paper-tex: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            --table-bg: radial-gradient(circle at center, #2e4133 0%, #111a14 100%);
        }

        /* RESET & BASE */
        body, html {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: var(--table-bg); color: #111; margin: 0; padding: 0;
            width: 100%; height: 100%; overflow: hidden; 
            touch-action: none; user-select: none; -webkit-user-select: none; -webkit-font-smoothing: antialiased;
        }

        /* --- STREAMING_CHUNK:Styling the Intro Screen --- */
        #intro-screen {
            position: fixed; inset: 0; z-index: 9999;
            background-color: #f4ede1; background-image: var(--paper-tex);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: opacity 0.4s ease, visibility 0.4s; padding: 5vw;
        }
        
        .box-replica {
            position: relative; width: 100%; max-width: 850px; aspect-ratio: 2 / 1;
            background-color: #f4ede1; box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 0 60px rgba(0,0,0,0.05);
            border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;
            background-image: var(--paper-tex); transition: transform 0.3s ease;
        }
        .box-replica:hover { transform: scale(1.02) translateY(-5px); }

        .box-top-row { display: flex; align-items: center; justify-content: space-between; padding: 4% 8%; flex: 1; z-index: 2;}
        .box-bottom-row { display: flex; align-items: flex-end; justify-content: space-between; padding: 4% 8%; flex: 1; z-index: 2;}

        .box-red-stripe {
            position: absolute; top: 50%; left: 0; width: 100%; transform: translateY(-50%); height: 18%;
            background: linear-gradient(to bottom, #e0252b, #c21920); display: flex; align-items: center; justify-content: center;
            border-top: 3px solid #9e141a; border-bottom: 3px solid #9e141a; z-index: 10;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .box-title { font-family: 'Montserrat', sans-serif; font-size: clamp(28px, 7vw, 75px); font-weight: 900; color: #fff; letter-spacing: 0.08em; text-shadow: 3px 3px 0px rgba(0,0,0,0.8); }

        .box-green-sq { width: 28%; max-width: 180px; aspect-ratio: 1; background-color: #4da85d; box-shadow: 3px 3px 15px rgba(0,0,0,0.15); display: flex; align-items: center; justify-content: center; border-radius: 4px; }
        
        .mini-board-mockup { width: 85%; height: 85%; border: 2px solid #111; background: var(--bg-board); display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 1px; padding: 1px;}
        .mini-board-mockup div { background: var(--cell-bg); border: 1px solid #111; box-sizing: border-box; }
        .mb-top { border-bottom: 3px solid var(--red) !important; }
        .mb-right { border-left: 3px solid var(--darkblue) !important; }
        .mb-bottom { border-top: 3px solid var(--lightblue) !important; }
        .mb-left { border-right: 3px solid var(--orange) !important; }

        .box-text-top { text-align: right; color: #111; font-family: 'Playfair Display', serif;}
        .box-text-top h2 { font-size: clamp(14px, 3.5vw, 30px); font-weight: 900; margin: 0; line-height: 1.1;}
        .box-text-top p { font-size: clamp(12px, 2.5vw, 22px); color: #2e7ca8; font-weight: bold; margin: 0; line-height: 1.1;}

        .box-blue-sq { width: 28%; max-width: 180px; height: 80%; background-color: #3b9bc2; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 2%; box-shadow: 3px 3px 15px rgba(0,0,0,0.15); border-radius: 4px 4px 0 0;}
        .box-logo-text { font-family: 'Playfair Display', serif; font-style: italic; color: #fff; font-size: clamp(12px, 2.8vw, 24px); font-weight: bold; text-align: center; line-height: 1;}
        
        .box-icon-group { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .box-trains { display: flex; align-items: center; gap: 12px; color: #3b9bc2; font-size: clamp(20px, 4.5vw, 45px); }
        .box-mr-mono { font-size: clamp(28px, 5.5vw, 55px); filter: drop-shadow(2px 2px 0 rgba(255,255,255,0.8)); }
        .box-dollar { color: #4da85d; font-size: clamp(35px, 7vw, 70px); font-weight: 900; font-family: 'Montserrat', sans-serif; line-height: 0.8; text-shadow: 1px 1px 0 #fff;}

        .click-to-start { position: absolute; bottom: 4vh; font-family: 'Montserrat', sans-serif; font-weight: 800; color: #111; font-size: clamp(14px, 4vw, 20px); letter-spacing: 2px; animation: pulse 1.5s infinite; background: rgba(255,255,255,0.7); padding: 10px 20px; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        @keyframes pulse { 0%, 100% { opacity: 0.6; transform: scale(0.98); } 50% { opacity: 1; transform: scale(1.02); } }

        /* --- STREAMING_CHUNK:Styling the Game Board Layout --- */
        #app-container { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; position: relative; }

        #board-area {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            display: flex; align-items: center; justify-content: center;
            width: min(76dvw, 76dvh); height: min(76dvw, 76dvh);
            box-shadow: 0 25px 60px rgba(0,0,0,0.9), 0 0 0 clamp(4px, 1.2vmin, 10px) var(--border-color);
            background-color: var(--border-color); border-radius: 4px;
            z-index: 10; contain: layout style paint;
        }

        #board {
            width: 100%; height: 100%; display: grid;
            grid-template-columns: 15.5% repeat(9, 1fr) 15.5%;
            grid-template-rows: 15.5% repeat(9, 1fr) 15.5%;
            gap: clamp(1px, 0.25vmin, 3px); background-color: var(--border-color); 
        }

        .cell {
            background-color: var(--cell-bg); background-image: var(--paper-tex);
            position: relative; overflow: hidden; box-sizing: border-box; container-type: size;
        }

        .cell-content {
            position: absolute; top: 50%; left: 50%; display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start; text-align: center;
            box-sizing: border-box; padding: 2% 0;
        }

        .bottom-row .cell-content, .top-row .cell-content { width: 100cqw; height: 100cqh; }
        .left-col .cell-content, .right-col .cell-content { width: 100cqh; height: 100cqw; }
        .corner .cell-content { width: 100cqw; height: 100cqh; justify-content: center; padding: 0;}

        .bottom-row .cell-content { transform: translate(-50%, -50%) rotate(0deg); }
        .top-row .cell-content { transform: translate(-50%, -50%) rotate(180deg); }
        .left-col .cell-content { transform: translate(-50%, -50%) rotate(90deg); }
        .right-col .cell-content { transform: translate(-50%, -50%) rotate(-90deg); }
        
        #cell-0 .cell-content, #cell-10 .cell-content, #cell-20 .cell-content, #cell-30 .cell-content { transform: translate(-50%, -50%) rotate(0deg); }

        .color-bar { position: absolute; top: 0; left: 0; right: 0; height: 22%; border-bottom: clamp(1px, 0.25vmin, 2px) solid var(--border-color); z-index: 2; }
        .has-color-bar { padding-top: 24%; }

        .property-name {
            font-weight: 700; font-size: clamp(4px, 1.1vmin, 13px); line-height: 1.1;
            text-transform: uppercase; margin: auto 0; font-family: 'Montserrat', sans-serif; letter-spacing: -0.02em;
            display: flex; align-items: center; justify-content: center; flex-grow: 1;
            padding: 0 4%; z-index: 1; color: #111; text-wrap: balance; word-wrap: break-word; text-align: center;
        }

        .property-price { font-size: clamp(3.5px, 0.8vmin, 10px); font-weight: 700; margin-bottom: 3%; flex-shrink: 0; color: #111; letter-spacing: 0.05em; font-family: 'Montserrat', sans-serif; }
        .icon-large { margin: auto; display: flex; align-items: center; justify-content: center; flex-grow: 1; }
        .svg-board-icon { width: clamp(18px, 4.5vmin, 55px); height: auto; max-height: clamp(18px, 4.5vmin, 55px); margin: auto; }
        
        #center-board {
            grid-column: 2 / span 9; grid-row: 2 / span 9;
            background-color: var(--bg-board); background-image: var(--paper-tex);
            position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden; box-shadow: inset 0 0 8vmin rgba(0,0,0,0.15);
        }

        .center-title { font-family: 'Montserrat', sans-serif; font-size: clamp(20px, 7vmin, 100px); font-weight: 300; letter-spacing: 0.15em; color: #1a1a1a; z-index: 5;}

        /* --- STREAMING_CHUNK:Styling Center Board Decks & Players --- */
        .deck-slot {
            position: absolute; width: 17vmin; height: 10vmin;
            border: clamp(2px, 0.4vmin, 4px) dashed rgba(0,0,0,0.4);
            display: flex; flex-direction: column; justify-content: center; align-items: center; perspective: 500px;
        }
        .deck-slot.probabilita { top: 16%; left: 16%; transform: rotate(-45deg); }
        .deck-slot.imprevisti { bottom: 16%; right: 16%; transform: rotate(-45deg); }
        
        /* FIX: Scritte dimensionate e posizionate per non toccare i bordi */
        .board-slot-text {
            position: absolute; font-family: 'Montserrat', sans-serif;
            font-size: clamp(7px, 1.4vmin, 18px); font-weight: 900;
            letter-spacing: 0.08em; color: #1a1a1a; white-space: nowrap; opacity: 0.85; text-align: center;
        }
        
        .deck-stack {
            position: absolute; width: 95%; height: 90%; background-color: #fff; border-radius: 2px;
            box-shadow: -1px 1px 0 #ddd, -2px 2px 0 #bbb, -3px 3px 0 #ddd, -4px 4px 0 #bbb, -5px 5px 15px rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center; border: 1px solid rgba(0,0,0,0.1);
            transform: translateZ(10px); background-image: var(--paper-tex);
        }
        .deck-stack.bg-prob { background-color: var(--prob-color); }
        .deck-stack.bg-impr { background-color: var(--impr-color); }

        .player-zone {
            position: absolute; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: linear-gradient(135deg, rgba(0,0,0,0.5), rgba(0,0,0,0.8)); padding: 1vmin; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1); transition: all 0.3s ease; backdrop-filter: blur(8px);
        }
        .player-zone.active {
            background: linear-gradient(135deg, rgba(40,0,0,0.85), rgba(150,0,0,0.95)); border-color: #ed1b24;
            box-shadow: 0 0 25px rgba(237, 27, 36, 0.7), inset 0 0 15px rgba(0,0,0,0.8);
        }
        .player-zone.bankrupt { opacity: 0.3; filter: grayscale(100%); pointer-events: none; }
        
        .pz-bottom { bottom: 1vmin; left: 50%; transform: translateX(-50%); width: clamp(220px, 32vw, 420px); }
        .pz-left   { left: 1vmin; top: 50%; transform: translateY(-50%); width: clamp(160px, 15vw, 220px); }
        .pz-top    { top: 1vmin; left: 50%; transform: translateX(-50%); width: clamp(220px, 32vw, 420px); }
        .pz-right  { right: 1vmin; top: 50%; transform: translateY(-50%); width: clamp(160px, 15vw, 220px); }

        .pz-info { 
            display: flex; align-items: center; gap: 10px; margin-bottom: 5px; color: #fff; font-family: 'Montserrat', sans-serif; 
            cursor: pointer; transition: transform 0.2s; padding: 4px; border-radius: 8px; width: 100%; justify-content: center;
        }
        .pz-info:hover { transform: scale(1.05); background: rgba(255,255,255,0.15); }
        
        .pz-name { font-weight: 800; font-size: clamp(11px, 1.8vmin, 18px); text-shadow: 1px 1px 2px #000; pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100px;}
        .pz-token { width: clamp(20px, 3.2vmin, 32px); height: clamp(20px, 3.2vmin, 32px); filter: drop-shadow(1px 2px 2px #000); pointer-events: none;}
        .pz-balance { font-family: 'Oswald', sans-serif; font-size: clamp(12px, 2vmin, 22px); color: #00e676; text-shadow: 1px 1px 2px #000; pointer-events: none;}

        .note-wrapper {
            width: clamp(55px, 11vmin, 100px); aspect-ratio: 1.85 / 1;
            position: relative; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
            user-select: none; flex-shrink: 0; filter: drop-shadow(1px 2px 3px rgba(0,0,0,0.5));
        }
        .note-wrapper:hover { transform: translateY(-5px) scale(1.1) !important; z-index: 100 !important; filter: drop-shadow(3px 5px 8px rgba(0,0,0,0.7)); }
        .note-stack { display: flex; justify-content: center; width: 100%; height: clamp(26px, 5.5vmin, 55px); position: relative; }
        .note-stack .note-wrapper { position: absolute; }

        /* --- STREAMING_CHUNK:Styling Dice, Tokens and Buildings --- */
        .dice-area { position: absolute; display: flex; gap: clamp(10px, 2.5vmin, 20px); z-index: 25; perspective: 1000px; margin-top: 10vmin;}
        @keyframes dice-pulse { 0% { transform: scale(1); filter: drop-shadow(0 0 0 transparent); } 100% { transform: scale(1.1) translateY(-1vmin); filter: drop-shadow(0 1vmin 3vmin rgba(255,215,0,0.9)); } }
        .dice-ready { animation: dice-pulse 1s infinite alternate ease-in-out; cursor: pointer; }
        
        .die-3d { width: clamp(20px, 4.5vmin, 40px); height: clamp(20px, 4.5vmin, 40px); position: relative; transform-style: preserve-3d; transition: transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .die-face { 
            position: absolute; width: 100%; height: 100%; 
            background: #111; border: clamp(1px, 0.3vmin, 2px) solid #333; border-radius: 18%; 
            display: grid; padding: 12%; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); 
            box-shadow: inset 0 0 1vmin rgba(255,255,255,0.15), inset 0 0 5px #000; 
        }
        .die-dot { 
            background: radial-gradient(circle at 30% 30%, #fff7b0 0%, #ffd700 40%, #b8860b 100%); 
            border-radius: 50%; width: 100%; height: 100%; box-shadow: inset 0.1vmin 0.1vmin 0.4vmin rgba(0,0,0,0.9), 0 0.1vmin 0.2vmin rgba(255,255,255,0.3); 
        }
        .dot-1 { grid-area: 1 / 1; } .dot-3 { grid-area: 1 / 3; } .dot-4 { grid-area: 2 / 1; } .dot-5 { grid-area: 2 / 2; } .dot-6 { grid-area: 2 / 3; } .dot-7 { grid-area: 3 / 1; } .dot-9 { grid-area: 3 / 3; }
        
        .face-1 { transform: rotateY(0deg) translateZ(calc(clamp(20px, 4.5vmin, 40px) / 2)); } .face-2 { transform: rotateY(-90deg) translateZ(calc(clamp(20px, 4.5vmin, 40px) / 2)); }
        .face-3 { transform: rotateX(90deg) translateZ(calc(clamp(20px, 4.5vmin, 40px) / 2)); } .face-4 { transform: rotateX(-90deg) translateZ(calc(clamp(20px, 4.5vmin, 40px) / 2)); }
        .face-5 { transform: rotateY(90deg) translateZ(calc(clamp(20px, 4.5vmin, 40px) / 2)); } .face-6 { transform: rotateY(180deg) translateZ(calc(clamp(20px, 4.5vmin, 40px) / 2)); }
        
        .anim-jump { animation: jump 1.2s ease-out forwards; }
        @keyframes jump { 0% { transform: translateY(0) scale(1); } 40% { transform: translateY(-15vmin) scale(1.3) rotateX(360deg) rotateZ(180deg); } 70% { transform: translateY(-3vmin) scale(1.05); } 100% { transform: translateY(0) scale(1); } }

        .token { position: absolute; z-index: 30; width: clamp(24px, 5.5vmin, 50px); height: clamp(24px, 5.5vmin, 50px); transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); transform: translate(-50%, -80%); pointer-events: none; }
        .token-svg { width: 100%; height: 100%; filter: drop-shadow(2px 5px 3px rgba(0,0,0,0.7)); }
        
        .house { width: clamp(5px, 1.2vmin, 14px); height: clamp(5px, 1.2vmin, 14px); background-color: #00a650; margin: 1px; box-shadow: inset -2px -2px 0px rgba(0,0,0,0.3), inset 2px 2px 0px rgba(255,255,255,0.4), 2px 2px 3px rgba(0,0,0,0.6); border-radius:1px;}
        .hotel { width: clamp(7px, 1.6vmin, 18px); height: clamp(7px, 1.6vmin, 18px); background-color: #ed1b24; margin: 1px; box-shadow: inset -3px -3px 0px rgba(0,0,0,0.3), inset 3px 3px 0px rgba(255,255,255,0.4), 2px 2px 3px rgba(0,0,0,0.6); border-radius:2px;}
        .buildings-container { display: flex; flex-wrap: wrap; justify-content: center; position: absolute; bottom: 2%; width: 100%; z-index: 3; gap: 2px;}
        .has-color-bar .buildings-container { top: 1%; bottom: auto; height: 20%; align-items: flex-end; }

        /* --- STREAMING_CHUNK:Styling Modals & Cards --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100dvw; height: 100dvh; background: rgba(0,0,0,0.75); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 200; }
        .modal-box-wrapper { transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); will-change: transform; width: 100%; display: flex; justify-content: center; }
        
        .modal-box { 
            background: #fdfbf7; background-image: var(--paper-tex); 
            border-radius: 12px; width: 95vw; max-width: 420px; max-height: 95dvh; 
            padding: clamp(15px, 3vw, 25px); 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.5); 
            color: #111; position: relative; text-align: center; overflow-y: auto; overflow-x: hidden; box-sizing: border-box; 
            display: flex; flex-direction: column; align-items: center;
        }
        
        .modal-box.solid-card { border-radius: 8px; border: 1px solid rgba(0,0,0,0.2); padding: 0; width: 85vw; max-width: 350px; overflow: visible;}
        
        /* CSS per l'effetto di rotazione carta 3D */
        .flip-container { background-color: transparent; width: 100%; max-width: 320px; aspect-ratio: 5/7.2; perspective: 1000px; margin: 0 auto; position: relative; z-index: 210;}
        .flip-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; cursor: pointer; }
        .flip-inner.is-flipped { transform: rotateY(180deg); }
        .flip-front, .flip-back { 
            position: absolute; inset: 0; -webkit-backface-visibility: hidden; backface-visibility: hidden; 
            border-radius: 8px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); 
            background: #fdfbf7; background-image: var(--paper-tex); border: 1px solid #ccc; 
            display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;
        }
        .flip-back { transform: rotateY(180deg); padding: 20px; justify-content: flex-start; align-items: center;}

        .card-property-original { background: transparent; padding: clamp(10px, 2.5vw, 15px); box-sizing: border-box; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: flex-start;}
        .cpo-header { border: 2px solid #111; padding: 8px 4px; margin-bottom: 15px; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 25%;}
        .cpo-subtitle { font-size: clamp(8px, 1.5vw, 0.7rem); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; opacity: 0.9;}
        .cpo-title { font-size: clamp(16px, 4vw, 1.4rem); font-family: 'Montserrat', sans-serif; font-weight: 900; text-transform: uppercase; line-height:1.1;}
        .cpo-body { font-size: clamp(11px, 2.5vw, 0.9rem); font-family: 'Helvetica Neue', sans-serif; line-height: 1.4; padding: 0 5px; text-align: left; flex-grow: 1; display:flex; flex-direction:column;}
        .cpo-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .cpo-row span:last-child { font-weight: bold; }
        .cpo-divider { border-top: 1px solid #ddd; margin: 10px 0; }
        .cpo-footer { font-size: clamp(10px, 2vw, 0.8rem); margin-top: auto; text-align: center;}

        .lang-selector { display: flex; gap: 6px; z-index: 10; margin-bottom: 10px; justify-content: center; flex-shrink: 0; width: 100%;}
        .lang-btn { background: #333; color: #fff; border: none; padding: 8px 16px; font-size: 13px; cursor: pointer; border-radius: 20px; font-weight: bold; transition: all 0.2s; flex: 1;}
        .lang-btn:hover { background: #555; transform: scale(1.05);}
        .lang-btn.active { background: #ed1b24; box-shadow: 0 3px 10px rgba(237,27,36,0.4); }

        .btn { 
            padding: clamp(10px, 2vw, 14px) clamp(12px, 2.5vw, 18px); 
            border: none; border-radius: 8px; font-weight: 800; cursor: pointer; transition: all 0.15s; 
            background: linear-gradient(to bottom, #f0f0f0, #e0e0e0); color: #222;

                        ${tokensLib.map(tkn => `<option value="${tkn.id}" ${tkn.id === defaultToken ? 'selected' : ''}>${tkn.name}</option>`).join('')}
                    </select>
                </div>`;
            document.getElementById('setup-players').appendChild(div);
            document.getElementById(`pname-${setupPlayerCount}`).value = `${t('player')} ${setupPlayerCount}`;
        }

        function startGame() {
            if(setupPlayerCount < 2) return;
            for(let i=1; i<=setupPlayerCount; i++) {
                const rawName = document.getElementById(`pname-${i}`).value;
                const safeName = escapeHTML(rawName) || `${t('player')} ${i}`;
                gameState.players.push({ id: i, name: safeName, emoji: document.getElementById(`ptoken-${i}`).value, balance: 150000, pos: 0, inJail: false, jailTurns: 0 });
            }
            document.getElementById('modal-setup').style.display = 'none';
            gameState.players.forEach(p => {
                const tkn = document.createElement('div'); tkn.id = `token-${p.id}`; tkn.className = 'token'; tkn.innerHTML = tokenSVGs[p.emoji];
                document.getElementById('board-area').appendChild(tkn);
            });
            updateTokens(); updateDashboard(); orientBoard(); document.getElementById('dice-area').classList.add('dice-ready');
        }

        const noteColors = { 100: 'var(--c100)', 1000: 'var(--c1000)', 10000: 'var(--c10000)', 50000: 'var(--c50000)' };
        function generateNoteSVG(val, colorHex) {
            const valStr = val.toLocaleString();
            return `
            <div class="note-wrapper note-${val}" data-val="${val}">
                <svg viewBox="0 0 200 108" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:100%; display:block;">
                    <rect width="200" height="108" fill="#fdfbf7" rx="2"/>
                    <rect x="4" y="4" width="192" height="100" fill="none" stroke="${colorHex}" stroke-width="1.5"/>
                    <pattern id="pat-${val}" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
                        <path d="M 0,4 l 8,0 M 4,0 l 0,8" stroke="${colorHex}" stroke-width="0.3" opacity="0.6"/>
                    </pattern>
                    <rect x="5.5" y="5.5" width="189" height="97" fill="url(#pat-${val})"/>
                    <g fill="#fdfbf7" stroke="${colorHex}" stroke-width="1" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold">
                        <rect x="4" y="4" width="35" height="16"/> <text x="21.5" y="16" fill="${colorHex}" stroke="none" text-anchor="middle">${valStr}</text>
                        <rect x="161" y="4" width="35" height="16"/> <text x="178.5" y="16" fill="${colorHex}" stroke="none" text-anchor="middle">${valStr}</text>
                        <rect x="4" y="88" width="35" height="16"/> <text x="21.5" y="100" fill="${colorHex}" stroke="none" text-anchor="middle">${valStr}</text>
                        <rect x="161" y="88" width="35" height="16"/> <text x="178.5" y="100" fill="${colorHex}" stroke="none" text-anchor="middle">${valStr}</text>
                    </g>
                    <rect x="45" y="12" width="110" height="84" rx="42" fill="#fdfbf7" stroke="${colorHex}" stroke-width="2"/>
                    <rect x="48" y="15" width="104" height="78" rx="39" fill="none" stroke="${colorHex}" stroke-width="0.5"/>
                    <path id="arch-${val}" d="M 55 42 Q 100 15 145 42" fill="none"/>
                    <text font-family="Montserrat" font-size="13" font-weight="900" fill="${colorHex}" letter-spacing="1">
                        <textPath href="#arch-${val}" startOffset="50%" text-anchor="middle">${t('monopoly')}</textPath>
                    </text>
                    <text x="100" y="70" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="900" fill="${colorHex}" text-anchor="middle" letter-spacing="-1">${valStr}</text>
                </svg>
            </div>`;
        }

        function getNotesArray(amount) {
            let notes = []; let rem = amount; let c50=0, c10=0, c1=0, c01=0;
            if (rem >= 500) { c01 = 5; rem -= 500; }
            if (rem >= 5000) { c1 = 5; rem -= 5000; }
            if (rem >= 40000) { c10 = 4; rem -= 40000; }
            c50 += Math.floor(rem / 50000); rem %= 50000; c10 += Math.floor(rem / 10000); rem %= 10000;
            c1 += Math.floor(rem / 1000); rem %= 1000; c01 += Math.floor(rem / 100); rem %= 100;
            const addN = (val, count) => { for(let i=0; i<count; i++) notes.push(val); };
            addN(50000, c50); addN(10000, c10); addN(1000, c1); addN(100, c01); return notes;
        }

        function updateDashboard() {
            gameState.players.forEach((p, i) => {
                const zone = document.getElementById(`pz-${i}`); if(!zone) return;
                zone.style.display = 'flex';
                let notesHtml = '<div class="note-stack">';
                const notes = getNotesArray(p.balance);
                notes.slice(0, 8).forEach((val, idx) => { notesHtml += generateNoteSVG(val, noteColors[val]).replace('<div class="note-wrapper', `<div class="note-wrapper" style="left: ${idx * 15}px; z-index: ${idx};"`); });
                if(notes.length > 8) notesHtml += `<div style="position:absolute; right:-20px; top:20px; color:white; font-weight:bold;">+${notes.length-8}</div>`;
                notesHtml += '</div>';

                zone.innerHTML = `
                    <div class="pz-info" onclick="viewPlayerProperties(${p.id})">
                        <div class="pz-token">${tokenSVGs[p.emoji]}</div>
                        <div class="pz-name">${p.name}</div>
                        <div class="pz-balance">L. ${p.balance.toLocaleString('it-IT')}</div>
                    </div>
                    ${notesHtml}
                `;
            });
        }

        function hasMonopoly(playerId, color) {
            if(!color) return false;
            const bd = getBoardData();
            const group = bd.filter(c => c.color === color);
            const owned = group.filter(c => gameState.properties[c.id] && gameState.properties[c.id].ownerId === playerId);
            return group.length > 0 && group.length === owned.length;
        }

        function viewPlayerProperties(playerId) {
            const p = gameState.players.find(x => x.id === playerId);
            const ownedIds = Object.keys(gameState.properties).filter(id => gameState.properties[id].ownerId === p.id);
            const bd = getBoardData();

            let html = `<h2 class="text-xl md:text-2xl font-bold mb-4 font-['Montserrat'] uppercase" style="color: #111;">${t('props_of')} ${p.name}</h2>`;

            if(ownedIds.length === 0) {
                html += `<p class="text-gray-600 mb-6">${t('no_props')}</p>`;
            } else {
                html += `<div class="flex flex-wrap gap-3 justify-center max-h-[60vh] overflow-y-auto pb-4 p-2 w-full">`;
                ownedIds.forEach(id => {
                    const cell = bd.find(c => c.id == id); const color = cell.color || '#333';
                    html += `<div onclick="viewPropertyCard(${id}, ${p.id})" class="cursor-pointer border border-gray-300 rounded shadow-md hover:scale-105 transition-transform bg-[#fdfbf7] flex flex-col overflow-hidden w-24 md:w-32 aspect-[5/6] hover:shadow-lg">
                                <div style="background-color: ${color}; height: 22%; width: 100%; border-bottom: 2px solid #111;"></div>
                                <div class="text-[9px] md:text-xs font-bold mt-2 px-1 leading-tight text-center font-['Montserrat'] uppercase flex-grow flex items-center justify-center text-[#111]">${cell.name.replace(/<br>/g, ' ')}</div>
                             </div>`;
                });
                html += `</div>`;
            }
            html += `<button class="btn mt-4" onclick="closeModal()">${t('ok_btn')}</button>`;
            openModal(html, false);
        }

        function getCardInnerHtml(cell) {
            const headerColor = cell.color || '#333';
            let inner = `<div class="card-property-original">
                            <div class="cpo-header" style="background-color: ${headerColor}; color: #fff;">
                                <div class="cpo-subtitle">${cell.type === 'property' ? t('prop_title') : ''}</div>
                                <div class="cpo-title">${cell.name.replace(/<br>/g, ' ')}</div>
                            </div>
                            <div class="cpo-body">`;
            if(cell.type === 'property') {
                inner += `  <div class="cpo-row mb-1"><span>${t('rent_base')}</span> <span>L. ${cell.rent[0]}</span></div>
                            ${[1,2,3,4].map(i => `<div class="cpo-row mb-1"><span>${t('with_house')} ${i} ${t('houses')}</span> <span>L. ${cell.rent[i]}</span></div>`).join('')}
                            <div class="cpo-row mt-2" style="font-size: 0.95rem;"><span>${t('with_house')} ${t('hotel')}</span> <span>L. ${cell.rent[5]}</span></div>
                            <div class="cpo-divider"></div>
                            <div class="cpo-footer">${t('mortgage')} L. ${cell.price / 2}<br>${t('house_cost')} L. ${cell.houseCost}</div>`;
            } else {
                inner += `  <div class="text-center font-bold text-lg mb-2 mt-4">${t('val_msg')} L. ${cell.price}</div>
                            <div class="text-center italic text-xs text-gray-700">${t('var_rent')}</div>`;
            }
            inner += `</div></div>`;
            return inner;
        }

        function viewPropertyCard(cellId, playerId) {
            const cell = getBoardData().find(c => c.id == cellId);
            const propState = gameState.properties[cellId];
            const isCurrentTurnOwner = (gameState.currentPlayerIdx === gameState.players.findIndex(x => x.id === playerId));
            const monopolyOwned = hasMonopoly(playerId, cell.color);
            const canBuild = isCurrentTurnOwner && cell.type === 'property' && propState.level < 5 && monopolyOwned;
            const maxedOut = cell.type === 'property' && propState.level === 5;

            let frontHtml = getCardInnerHtml(cell);
            
            // Rigorosa logica di costruzione sul retro
            let backHtml = `
                <h3 class="font-black text-lg mb-2 font-['Montserrat'] uppercase text-gray-800 border-b-2 border-gray-300 pb-2 w-full">${cell.name.replace(/<br>/g, ' ')}</h3>
                <p class="text-xs text-gray-700 text-left mb-3 italic leading-relaxed border-l-4 border-red-500 pl-2 bg-red-50 py-1 w-full">${t('monopoly_req')}</p>
                <div class="w-full text-left font-bold text-xs md:text-sm mb-4 bg-gray-100 p-2 rounded">
                    ${t('curr_level')}: <span class="text-red-600">${propState.level} ${propState.level === 5 ? '(Hotel)' : '(Case)'}</span><br>
                    <span class="text-xs text-gray-500">Monopolio: ${monopolyOwned ? `✅ ${t('monopoly_yes')}` : `❌ ${t('monopoly_no')}`}</span>
                </div>
                <div class="flex flex-col gap-2 w-full mt-auto">
                    ${maxedOut ? `<button class="btn w-full bg-gray-300" disabled>${t('max_level')}</button>` :
                      canBuild ? `<button class="btn btn-buy w-full shadow-lg" onclick="buildHouseFromCard(event, ${cellId}, ${playerId})">${t('build_btn_card')} (L. ${cell.houseCost})</button>` : 
                                 `<button class="btn w-full" disabled>${t('cannot_build')}</button>`}
                    <button class="btn w-full bg-gray-200" onclick="event.stopPropagation(); viewPlayerProperties(${playerId})">${t('back_btn')}</button>
                </div>
            `;

            let html = `
                <div class="flip-container" onclick="this.querySelector('.flip-inner').classList.toggle('is-flipped')">
                    <div class="flip-inner">
                        <div class="flip-front">${frontHtml}</div>
                        <div class="flip-back">${backHtml}</div>
                    </div>
                </div>
                <p class="text-xs text-gray-500 mt-4 animate-pulse font-bold">${t('flip_hint')}</p>
            `;
            openModal(html, true, 'transparent', true);
        }

        function buildHouseFromCard(event, cellId, playerId) {
            event.stopPropagation(); // Previene il flip
            const p = gameState.players.find(x => x.id === playerId);
            const cell = getBoardData().find(c => c.id === cellId);

            // Controllo rigoroso dei fondi per evitare allucinazioni
            if(p.balance < cell.houseCost) {
                showToast(`⚠️ ${t('insuff_funds')}`);
                return;
            }

            openPayment(cell.houseCost, `${t('build_title')} - ${cell.name.replace(/<br>/g, ' ')}`, () => {
                p.balance -= cell.houseCost;
                gameState.properties[cellId].level++;
                renderBuildings(cellId);
                updateDashboard();
                viewPropertyCard(cellId, playerId); // Refresh della carta
            }, false);
        }

        function renderBuildings(cellId) {
            const bld = document.getElementById(`bld-${cellId}`); if(!bld) return;
            const lvl = gameState.properties[cellId]?.level || 0; bld.innerHTML = '';
            if(lvl === 5) bld.innerHTML = `<div class="hotel"></div>`;
            else for(let i=0; i<lvl; i++) bld.innerHTML += `<div class="house"></div>`;
        }

        function updateTokens() {
            if (gameState.players.length === 0) return;
            const parentRect = document.getElementById('board-area').getBoundingClientRect();
            const posCounts = {}; gameState.players.forEach(p => { if (p.balance >= 0) posCounts[p.pos] = (posCounts[p.pos] || 0) + 1; });
            const currentPosIndex = {};

            gameState.players.forEach(p => {
                if(p.balance < 0) return; 
                const cell = document.getElementById(`cell-${p.pos}`); if(!cell) return;
                const rect = cell.getBoundingClientRect();
                const centerX = (rect.left - parentRect.left) + rect.width/2;
                const centerY = (rect.top - parentRect.top) + rect.height/2;

                currentPosIndex[p.pos] = (currentPosIndex[p.pos] || 0);
                const indexOnCell = currentPosIndex[p.pos]; currentPosIndex[p.pos]++;
                const totalOnCell = posCounts[p.pos];
                
                let offsetX = 0; let offsetY = 0;
                if (totalOnCell > 1) {
                    const radius = rect.width * 0.25; 
                    const angle = (indexOnCell / totalOnCell) * Math.PI * 2 + (Math.PI/4);
                    offsetX = Math.cos(angle) * radius; offsetY = Math.sin(angle) * radius;
                }

                const tEl = document.getElementById(`token-${p.id}`);
                tEl.style.left = `${centerX + offsetX}px`; tEl.style.top = `${centerY + offsetY}px`;
            });
        }
        window.addEventListener('resize', () => setTimeout(updateTokens, 100));

        function orientBoard() { document.querySelectorAll('.player-zone').forEach((z, i) => z.classList.toggle('active', i === gameState.currentPlayerIdx)); }

        const diceRots = { 1: {x: 0, y: 0}, 2: {x: 0, y: 90}, 3: {x: -90, y: 0}, 4: {x: 90, y: 0}, 5: {x: 0, y: -90}, 6: {x: 180, y: 0} };
        function rollDice() {
            const diceArea = document.getElementById('dice-area');
            if(!diceArea.classList.contains('dice-ready') || gameState.isMoving) return;
            diceArea.classList.remove('dice-ready'); 
            
            const p = gameState.players[gameState.currentPlayerIdx];
            if(p.inJail) {
                p.jailTurns++;
                if(p.jailTurns > 3) { p.inJail = false; p.jailTurns = 0; payBankActive(5000); return; } 
                else { setTimeout(endTurn, 1000); return; }
            }

            gameState.isMoving = true;
            const val1 = Math.floor(Math.random() * 6) + 1; const val2 = Math.floor(Math.random() * 6) + 1;
            gameState.lastRoll = val1 + val2;

            const d1El = document.getElementById('die1'); const d2El = document.getElementById('die2');
            const b1 = document.getElementById('bounce1'); const b2 = document.getElementById('bounce2');
            b1.classList.remove('anim-jump'); b2.classList.remove('anim-jump'); void b1.offsetWidth;
            b1.classList.add('anim-jump'); b2.classList.add('anim-jump');

            const spin = () => Math.floor(Math.random() * 2 + 2) * 360;
            d1El.style.transform = `rotateX(${diceRots[val1].x + spin()}deg) rotateY(${diceRots[val1].y + spin()}deg)`;
            d2El.style.transform = `rotateX(${diceRots[val2].x + spin()}deg) rotateY(${diceRots[val2].y + spin()}deg)`;

            setTimeout(() => stepMove(p, gameState.lastRoll), 1200);
        }

        function stepMove(player, stepsLeft) {
            if(stepsLeft === 0) { setTimeout(() => handleLanded(player), 300); return; }
            player.pos++; if(player.pos >= 40) { player.pos = 0; receiveMoney(player, 20000); showToast(t('go_msg')); }
            updateTokens(); setTimeout(() => stepMove(player, stepsLeft - 1), 300); 
        }

        function handleLanded(player) {
            const bd = getBoardData(); const cell = bd[player.pos]; let html = ''; let isCard = false; let cardColor = '';
            
            if (cell.type === 'property' || cell.type === 'station' || cell.type === 'utility') {
                const propState = gameState.properties[cell.id];
                html += getCardInnerHtml(cell);

                if (!propState.ownerId) {
                    html += `<div class="flex gap-2 w-full mt-2">
                                <button class="btn btn-buy btn-inline" onclick="buyProperty(${cell.id})">${t('buy_btn')} L. ${cell.price}</button>
                                <button class="btn btn-inline" onclick="endTurn()">${t('pass_btn')}</button>
                             </div>`;
                } else if (propState.ownerId !== player.id) {
                    const owner = gameState.players.find(p => p.id === propState.ownerId); const rent = calculateRent(cell, propState);
                    html += `<p class="mb-2 text-red-600 font-bold text-lg">${t('prop_of')} ${owner.name}</p>
                             <button class="btn btn-pay" onclick="payRent(${cell.id}, ${rent})">${t('pay_btn')} L. ${rent}</button>`;
                } else if (cell.type === 'property' && propState.level < 5) {
                    const canBuild = hasMonopoly(player.id, cell.color);
                    html += `<p class="mb-2 text-green-600 font-bold">${t('your_prop')}</p>
                             <div class="flex gap-2 w-full mt-2">
                                <button class="btn btn-buy btn-inline" onclick="${canBuild ? `buildHouse(${cell.id})` : `showToast('${t('monopoly_req')}')`}">
                                    ${t('build_btn')} L. ${cell.houseCost}
                                </button>
                                <button class="btn btn-inline" onclick="endTurn()">${t('end_turn')}</button>
                             </div>`;
                } else { html += `<button class="btn" onclick="endTurn()">${t('end_turn')}</button>`; }
            } else if (cell.type === 'chance' || cell.type === 'chest') {
                isCard = true; const isProb = cell.type === 'chance'; cardColor = isProb ? 'var(--prob-color)' : 'var(--impr-color)';
                const events = i18n[currentLang].events; const evIndex = Math.floor(Math.random() * events.length);
                const eventTxt = events[evIndex];
                
                html += `
                    <div class="flex flex-col items-center justify-center h-full text-[#111] px-4 py-6" style="flex: 1; min-height: 180px;">
                        <div class="font-black text-xl md:text-2xl mb-4 font-['Montserrat'] uppercase tracking-widest text-center opacity-80 border-b-2 border-[#111] pb-2 w-full">${isProb ? t('chance_title') : t('chest_title')}</div>
                        <div class="text-base md:text-lg font-medium font-['Helvetica_Neue',sans-serif] text-center leading-relaxed w-full">"${eventTxt}"</div>
                    </div>
                    <div class="flex justify-center p-3 w-full bg-black bg-opacity-5">
                        <button class="btn bg-white bg-opacity-40 border-[#111] text-[#111] shadow-none hover:bg-opacity-60 w-full max-w-[200px]" onclick="resolveCard(${evIndex})">${t('ok_btn')}</button>
                    </div>`;
            } else if (cell.type === 'tax') {
                html += `<h2 class="text-lg md:text-xl font-bold mb-2 text-red-600 font-['Montserrat']">${cell.name.replace(/<br>/g, ' ')}</h2>
                         <button class="btn btn-pay" onclick="payBankActive(${cell.cost})">${t('pay_btn')} L. ${cell.cost}</button>`;
            } else if (cell.id === 30) {
                html += `<h2 class="text-lg md:text-xl font-bold mb-2 text-red-600 font-['Montserrat']">${t('go_jail_btn')}</h2>
                         <button class="btn btn-pay" onclick="goToJail()">${t('ok_btn')}</button>`;
            } else {
                html += `<h2 class="text-lg md:text-xl font-bold mb-2 font-['Montserrat']">${cell.name.replace(/<br>/g, ' ')}</h2><button class="btn" onclick="endTurn()">${t('ok_btn')}</button>`;
            }
            openModal(html, isCard, cardColor);
        }

        function calculateRent(cell, propState) {
            if (cell.type === 'property') return cell.rent[propState.level];
            if (cell.type === 'station') return 2500 * Math.pow(2, [5,15,25,35].filter(id => gameState.properties[id].ownerId === propState.ownerId).length - 1);
            if (cell.type === 'utility') return gameState.lastRoll * ([12,28].filter(id => gameState.properties[id].ownerId === propState.ownerId).length === 2 ? 1000 : 400);
            return 0;
        }

        function buyProperty(cellId) {
            const p = gameState.players[gameState.currentPlayerIdx]; const cell = getBoardData().find(c => c.id === cellId);
            openPayment(cell.price, `${t('buy_title')} - ${cell.name.replace(/<br>/g, ' ')}`, () => {
                p.balance -= cell.price; gameState.properties[cellId].ownerId = p.id;
                document.getElementById(`cell-${cellId}`).style.border = `2px solid ${['#ed1b24','#00a650','#0054a6','#f57c00'][p.id%4]}`;
                updateDashboard(); endTurn();
            }, false); 
        }
        function payRent(cellId, amount) {
            const p = gameState.players[gameState.currentPlayerIdx]; const ownerId = gameState.properties[cellId].ownerId;
            const cell = getBoardData().find(c => c.id === cellId);
            openPayment(amount, `${t('rent_title')} - ${cell.name.replace(/<br>/g, ' ')}`, () => {
                p.balance -= amount; gameState.players.find(x => x.id === ownerId).balance += amount; updateDashboard(); endTurn();
            }, true); 
        }
        function buildHouse(cellId) {
            const p = gameState.players[gameState.currentPlayerIdx]; const cell = getBoardData().find(c => c.id === cellId);
            openPayment(cell.houseCost, `${t('build_title')} - ${cell.name.replace(/<br>/g, ' ')}`, () => {
                p.balance -= cell.houseCost; gameState.properties[cellId].level++; renderBuildings(cellId); updateDashboard(); endTurn();
            }, false); 
        }
        
        function resolveCard(evIndex) {
            closeModal(); const p = gameState.players[gameState.currentPlayerIdx];
            switch(evIndex) {
                case 0: goToJail(); break; case 1: advanceTo(p, 39); break; case 2: advanceTo(p, 1); break;  
                case 3: receiveMoney(p, 10000); endTurn(); break; case 4: receiveMoney(p, 15000); endTurn(); break; case 5: payBankActive(1500); break;
                default: endTurn();
            }
        }
        
        function advanceTo(p, targetPos) {
            if (targetPos < p.pos && targetPos !== 10) { p.balance += 20000; showToast(t('go_msg')); updateDashboard(); }
            p.pos = targetPos; updateTokens(); setTimeout(() => handleLanded(p), 600); 
        }

        function payBankActive(amount) { openPayment(amount, t('tax_title'), () => { gameState.players[gameState.currentPlayerIdx].balance -= amount; updateDashboard(); endTurn(); }, true); }
        function receiveMoney(player, amount) { player.balance += amount; updateDashboard(); }
        function goToJail() { closeModal(); const p = gameState.players[gameState.currentPlayerIdx]; p.pos = 10; p.inJail = true; updateTokens(); endTurn(); }

        let currentPayment = { amount: 0, callback: null, traySum: 0, wallet: [], tray: [], isMandatory: false };

        function openPayment(amount, reason, callback, isMandatory = false) {
            const p = gameState.players[gameState.currentPlayerIdx];
            if (p.balance < amount) { 
                showToast(`⚠️ ${t('bankrupt_msg')} ${p.name}!`); 
                p.balance = -1; endTurn(); return; 
            }
            closeModal();
            const pw = document.getElementById('payment-wrapper'); if(pw) pw.style.transform = `scale(1) rotate(0deg)`;
            currentPayment = { amount: amount, callback: callback, traySum: 0, wallet: getNotesArray(p.balance), tray: [], isMandatory: isMandatory };
            document.getElementById('pay-title').innerText = reason; renderPaymentUI();
            setTimeout(() => { document.getElementById('modal-payment').style.display = 'flex'; }, 50);
        }

        function renderPaymentUI() {
            document.getElementById('pay-desc').innerHTML = `${t('pay_req')} <b>L. ${currentPayment.amount.toLocaleString('it-IT')}</b>`;
            const renderNotes = (arr, onclickStr) => {
                if(arr.length === 0) return `<span class="text-gray-400 text-sm w-full text-center">${t('empty')}</span>`;
                return arr.map((val, i) => {
                    const svgHtml = generateNoteSVG(val, noteColors[val]);
                    return svgHtml.replace('<div ', `<div onclick="${onclickStr}(${i})" style="z-index: ${i};" `);
                }).join('');
            };
            document.getElementById('pay-tray').innerHTML = renderNotes(currentPayment.tray, 'moveNoteToWallet');
            document.getElementById('pay-wallet').innerHTML = renderNotes(currentPayment.wallet, 'moveNoteToTray');
            const sumEl = document.getElementById('tray-sum'); sumEl.innerText = `L. ${currentPayment.traySum.toLocaleString('it-IT')}`;
            const btnConfirm = document.getElementById('btn-confirm-pay'); const btnCancel = document.getElementById('btn-cancel-pay');
            
            if (currentPayment.traySum >= currentPayment.amount) {
                sumEl.className = "float-right text-green-600 font-black text-sm"; btnConfirm.disabled = false;
                const change = currentPayment.traySum - currentPayment.amount;
                btnConfirm.innerText = change > 0 ? `${t('pay_recv')} (L. ${change.toLocaleString()})` : t('confirm_pay');
            } else {
                sumEl.className = "float-right text-red-600 font-black text-sm"; btnConfirm.disabled = true; btnConfirm.innerText = t('confirm_pay');
            }
            btnCancel.style.display = currentPayment.isMandatory ? 'none' : 'inline-flex';
        }

        function moveNoteToTray(index) { const val = currentPayment.wallet.splice(index, 1)[0]; currentPayment.tray.push(val); currentPayment.traySum += val; renderPaymentUI(); }
        function moveNoteToWallet(index) { const val = currentPayment.tray.splice(index, 1)[0]; currentPayment.wallet.push(val); currentPayment.traySum -= val; renderPaymentUI(); }
        function confirmPayment() { if (currentPayment.traySum >= currentPayment.amount) { document.getElementById('modal-payment').style.display = 'none'; if (currentPayment.callback) currentPayment.callback(); } }
        function cancelPayment() { document.getElementById('modal-payment').style.display = 'none'; endTurn(); }

        function openModal(html, isCard = false, bgColor = '', isFlip = false) { 
            const content = document.getElementById('action-content'); content.innerHTML = html;
            if (isFlip) { content.className = 'modal-box solid-card'; content.style.backgroundColor = 'transparent'; content.style.boxShadow = 'none'; content.style.border = 'none'; } 
            else if (isCard) { content.className = 'modal-box solid-card'; content.style.backgroundColor = bgColor || '#fdfbf7'; content.style.boxShadow = ''; content.style.border = ''; } 
            else { content.className = 'modal-box'; content.style.backgroundColor = '#fdfbf7'; content.style.boxShadow = ''; content.style.border = ''; }
            document.getElementById('modal-action').style.display = 'flex'; 
        }
        function closeModal() { document.getElementById('modal-action').style.display = 'none'; }

        function endTurn() {
            closeModal(); gameState.isMoving = false;
            const currP = gameState.players[gameState.currentPlayerIdx];
            if(currP.balance < 0) {
                Object.keys(gameState.properties).forEach(k => {
                    if(gameState.properties[k].ownerId === currP.id) {
                        gameState.properties[k].ownerId = null; gameState.properties[k].level = 0;
                        const cellEl = document.getElementById(`cell-${k}`); if(cellEl) cellEl.style.border = ''; renderBuildings(k);
                    }
                });
                const tokenEl = document.getElementById(`token-${currP.id}`); if(tokenEl) tokenEl.style.display = 'none';
                const pzEl = document.getElementById(`pz-${gameState.currentPlayerIdx}`); if(pzEl) pzEl.classList.add('bankrupt');
            }

            let nextIdx = (gameState.currentPlayerIdx + 1) % gameState.players.length; let loops = 0;
            while(gameState.players[nextIdx].balance < 0 && loops < gameState.players.length) { nextIdx = (nextIdx + 1) % gameState.players.length; loops++; }
            if (loops >= gameState.players.length - 1) {
                showToast(`🏆 ${gameState.players[nextIdx].name.toUpperCase()} ${t('winner')} 🏆`);
                orientBoard(); updateDashboard(); return;
            }
            gameState.currentPlayerIdx = nextIdx; orientBoard(); updateDashboard(); 
            setTimeout(() => document.getElementById('dice-area').classList.add('dice-ready'), 500);
        }

        window.onload = () => { 
            const detectedLang = detectBrowserLanguage();
            setLang(detectedLang); 
            addSetupPlayer(); addSetupPlayer(); 
        };
    </script>
</body>
</html>
